<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Город после полуночи</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070c;
    font-family: Arial, sans-serif;
    color: white;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 40%, #263247 0%, #101722 35%, #05070c 75%);
}

/* Луна */

#moon {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #d9e2e8;
    box-shadow: 0 0 45px #aabed0;
    top: 8%;
    right: 12%;
}

/* Туман */

.fog {
    position: absolute;
    width: 160%;
    height: 35%;
    left: -30%;
    bottom: 8%;
    background: rgba(180, 195, 205, 0.08);
    filter: blur(25px);
    animation: fog 12s linear infinite alternate;
}

@keyframes fog {
    from { transform: translateX(-8%); }
    to { transform: translateX(8%); }
}

/* Дорога */

#road {
    position: absolute;
    left: 35%;
    bottom: 0;
    width: 30%;
    height: 75%;
    background: #11151c;
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
}

/* Здания */

.building {
    position: absolute;
    bottom: 28%;
    width: 24%;
    height: 40%;
    background: #171b22;
    border: 3px solid #080a0e;
    box-shadow: 0 10px 30px #000;
}

.building::before {
    content: "";
    position: absolute;
    inset: 12px;
    background:
        repeating-linear-gradient(
            to right,
            #222a32 0 18px,
            #080b10 18px 30px
        );
    opacity: .8;
}

#house {
    left: 4%;
}

#shop {
    right: 4%;
}

#school {
    left: 38%;
    bottom: 50%;
    width: 24%;
    height: 22%;
    background: #20252d;
}

/* Названия */

.sign {
    position: absolute;
    z-index: 3;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    color: #aebbc5;
    font-size: 12px;
    letter-spacing: 2px;
}

/* Игрок */

#player {
    position: absolute;
    width: 28px;
    height: 48px;
    left: 50%;
    top: 68%;
    transform: translate(-50%, -50%);
    z-index: 10;
}

#head {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #c99370;
    left: 5px;
    top: 0;
}

#body {
    position: absolute;
    width: 20px;
    height: 28px;
    border-radius: 7px 7px 3px 3px;
    background: #293849;
    left: 4px;
    top: 17px;
}

#legs {
    position: absolute;
    width: 7px;
    height: 17px;
    background: #111722;
    left: 5px;
    top: 42px;
    box-shadow: 11px 0 #111722;
}

/* Фонарик */

#flashlight {
    position: absolute;
    pointer-events: none;
    z-index: 8;
    left: 50%;
    top: 63%;
    width: 230px;
    height: 230px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255,255,220,.24) 0%,
        rgba(255,255,220,.10) 25%,
        rgba(255,255,220,.02) 55%,
        transparent 70%
    );
}

/* Верхний интерфейс */

#title {
    position: absolute;
    z-index: 20;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    text-shadow: 0 0 10px black;
}

#message {
    position: absolute;
    z-index: 20;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    color: #aeb8c1;
    font-size: 13px;
}

/* Джойстик */

#joystick {
    position: absolute;
    z-index: 30;
    bottom: 25px;
    left: 25px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.15);
}

#stick {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 33px;
    top: 33px;
    border-radius: 50%;
    background: rgba(220,230,240,.35);
    border: 2px solid rgba(255,255,255,.25);
}

/* Кнопка фонарика */

#lightButton {
    position: absolute;
    z-index: 30;
    bottom: 35px;
    right: 25px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.1);
    color: white;
    font-size: 28px;
}

/* Ночь */

.dark #flashlight {
    opacity: .15;
}

#blackout {
    position: absolute;
    z-index: 15;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        circle at 50% 65%,
        transparent 0 15%,
        rgba(0,0,0,.45) 45%,
        rgba(0,0,0,.85) 100%
    );
}
</style>
</head>

<body>

<div id="game">

    <div id="moon"></div>

    <div id="title">ГОРОД ПОСЛЕ ПОЛУНОЧИ</div>

    <div id="message">
        Ты проснулся на пустой улице... Здесь слишком тихо.
    </div>

    <div id="road"></div>

    <div id="house" class="building">
        <div class="sign">ДОМ</div>
    </div>

    <div id="shop" class="building">
        <div class="sign">МАГАЗИН</div>
    </div>

    <div id="school" class="building">
        <div class="sign">ШКОЛА</div>
    </div>

    <div class="fog"></div>

    <div id="flashlight"></div>

    <div id="blackout"></div>

    <div id="player">
        <div id="head"></div>
        <div id="body"></div>
        <div id="legs"></div>
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="lightButton">🔦</button>

</div>

<script>

const player = document.getElementById("player");
const stick = document.getElementById("stick");
const joystick = document.getElementById("joystick");
const flashlight = document.getElementById("flashlight");
const message = document.getElementById("message");
const lightButton = document.getElementById("lightButton");

let x = window.innerWidth / 2;
let y = window.innerHeight * 0.68;

let moving = false;
let lightOn = true;

let joyX = 0;
let joyY = 0;

function updatePlayer() {

    x += joyX * 3;
    y += joyY * 3;

    x = Math.max(20, Math.min(window.innerWidth - 20, x));
    y = Math.max(120, Math.min(window.innerHeight - 80, y));

    player.style.left = x + "px";
    player.style.top = y + "px";

    flashlight.style.left = x + "px";
    flashlight.style.top = (y - 35) + "px";

    checkPlace();
}

function checkPlace() {

    if (x < window.innerWidth * .3 && y < window.innerHeight * .7) {
        message.textContent = "Старый дом... Внутри что-то блеснуло.";
    }
    else if (x > window.innerWidth * .7 && y < window.innerHeight * .7) {
        message.textContent = "Заброшенный магазин. Дверь заперта.";
    }
    else if (
        x > window.innerWidth * .38 &&
        x < window.innerWidth * .62 &&
        y < window.innerHeight * .55
    ) {
        message.textContent = "Старая школа. На втором этаже горит свет.";
    }
    else {
        message.textContent = "Ты один посреди пустого города...";
    }
}

/* Джойстик */

function moveStick(clientX, clientY) {

    const rect = joystick.getBoundingClientRect();

    let dx = clientX - (rect.left + rect.width / 2);
    let dy = clientY - (rect.top + rect.height / 2);

    const distance = Math.sqrt(dx * dx + dy * dy);
    const max = 38;

    if (distance > max) {
        dx = dx / distance * max;
        dy = dy / distance * max;
    }

    stick.style.transform =
        `translate(${dx}px, ${dy}px)`;

    joyX = dx / max;
    joyY = dy / max;
}

joystick.addEventListener("touchstart", e => {
    moving = true;
    moveStick(
        e.touches[0].clientX,
        e.touches[0].clientY
    );
});

joystick.addEventListener("touchmove", e => {

    if (!moving) return;

    moveStick(
        e.touches[0].clientX,
        e.touches[0].clientY
    );

    e.preventDefault();

}, { passive: false });

joystick.addEventListener("touchend", () => {

    moving = false;

    stick.style.transform = "translate(0,0)";

    joyX = 0;
    joyY = 0;
});

/* Фонарик */

lightButton.addEventListener("click", () => {

    lightOn = !lightOn;

    flashlight.style.opacity = lightOn ? "1" : "0";

    lightButton.textContent =
        lightOn ? "🔦" : "🌑";
});

/* Клавиатура для компьютера */

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function keyboardControl() {

    joyX = 0;
    joyY = 0;

    if (keys["a"] || keys["arrowleft"]) joyX = -1;
    if (keys["d"] || keys["arrowright"]) joyX = 1;
    if (keys["w"] || keys["arrowup"]) joyY = -1;
    if (keys["s"] || keys["arrowdown"]) joyY = 1;
}

/* Игровой цикл */

function gameLoop() {

    if (!moving) {
        keyboardControl();
    }

    updatePlayer();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>

        </div>

            🔑
        </div>

            На полу лежит старый ключ.

            Нажми на него, чтобы подобрать.

        </button>

    </div>

<script>

const player =
    document.getElementById("player");

const stick =
    document.getElementById("stick");

const joystick =
    document.getElementById("joystick");

const flashlight =
    document.getElementById("flashlight");

const message =
    document.getElementById("message");

const lightButton =
    document.getElementById("lightButton");

const enterButton =
    document.getElementById("enterButton");

const houseInterior =
    document.getElementById("houseInterior");

const exitButton =
    document.getElementById("exitButton");

const item =
    document.getElementById("item");

let x =
    window.innerWidth / 2;

let y =
    window.innerHeight * .68;

let joyX = 0;
let joyY = 0;

let moving = false;

let lightOn = true;

let hasKey = false;


/* Обновление игрока */

function updatePlayer() {

    x += joyX * 3;

    y += joyY * 3;

    x =
        Math.max(
            20,
            Math.min(
                window.innerWidth - 20,
                x
            )
        );

    y =
        Math.max(
            120,
            Math.min(
                window.innerHeight - 80,
                y
            )
        );

    player.style.left =
        x + "px";

    player.style.top =
        y + "px";

    flashlight.style.left =
        x + "px";

    flashlight.style.top =
        (y - 35) + "px";

    checkPlace();
}


/* Проверяем положение */

function checkPlace() {

    /*
       Левая часть города —
       старый дом
    */

    if (
        x <
        window.innerWidth * .30 &&
        y <
        window.innerHeight * .72
    ) {

        message.textContent =
            "Старый дом... Кажется, дверь открыта.";

        enterButton.style.display =
            "block";

        return;
    }

    enterButton.style.display =
        "none";

    /*
       Магазин
    */

    if (
        x >
        window.innerWidth * .70 &&
        y <
        window.innerHeight * .72
    ) {

        message.textContent =
            "Заброшенный магазин. Дверь заперта.";

        return;
    }

    /*
       Школа
    */

    if (
        x >
        window.innerWidth * .38 &&
        x <
        window.innerWidth * .62 &&
        y <
        window.innerHeight * .55
    ) {

        message.textContent =
            "Старая школа. На втором этаже горит свет.";

        return;
    }

    message.textContent =
        "Ты один посреди пустого города...";
}


/* Вход */

enterButton.addEventListener(
    "click",
    () => {

        houseInterior.style.display =
            "block";

        enterButton.style.display =
            "none";

        message.style.display =
            "none";

    }
);


/* Выход */

exitButton.addEventListener(
    "click",
    () => {

        houseInterior.style.display =
            "none";

        message.style.display =
            "block";

        message.textContent =
            "Ты снова на улице.";

    }
);


/* Подобрать ключ */

item.addEventListener(
    "click",
    () => {

        hasKey = true;

        item.style.display =
            "none";

        document.getElementById(
            "itemText"
        ).innerHTML =
            "Ты нашёл старый ключ.<br><br>🔑 Ключ получен!";

    }
);


/* Фонарик */

lightButton.addEventListener(
    "click",
    () => {

        lightOn =
            !lightOn;

        flashlight.style.opacity =
            lightOn ? "1" : "0";

        lightButton.textContent =
            lightOn ? "🔦" : "🌑";

    }
);


/* Джойстик */

function moveStick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();

    let dx =
        clientX -
        (
            rect.left +
            rect.width / 2
        );

    let dy =
        clientY -
        (
            rect.top +
            rect.height / 2
        );

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const max = 38;

    if (distance > max) {

        dx =
            dx / distance * max;

        dy =
            dy / distance * max;

    }

    stick.style.transform =
        `translate(${dx}px, ${dy}px)`;

    joyX =
        dx / max;

    joyY =
        dy / max;
}


joystick.addEventListener(
    "touchstart",
    e => {

        moving = true;

        moveStick(
            e.touches[0].clientX,
            e.touches[0].clientY
        );

    }
);


joystick.addEventListener(
    "touchmove",
    e => {

        if (!moving)
            return;

        moveStick(
            e.touches[0].clientX,
            e.touches[0].clientY
        );

        e.preventDefault();

    },
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchend",
    () => {

        moving = false;

        stick.style.transform =
            "translate(0,0)";

        joyX = 0;
        joyY = 0;

    }
);


/* Клавиатура */

const keys = {};

document.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

    }
);


document.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


function keyboardControl() {

    if (moving)
        return;

    joyX = 0;
    joyY = 0;

    if (
        keys["a"] ||
        keys["arrowleft"]
    )
        joyX = -1;

    if (
        keys["d"] ||
        keys["arrowright"]
    )
        joyX = 1;

    if (
        keys["w"] ||
        keys["arrowup"]
    )
        joyY = -1;

    if (
        keys["s"] ||
        keys["arrowdown"]
    )
        joyY = 1;
}


/* Игровой цикл */

function gameLoop() {

    keyboardControl();

    updatePlayer();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

</script>
