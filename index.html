<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Новый Шаг</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:none;
}

#game{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
    background:#8fb7c8;
}

/* Кинематографический эффект */

#cinemaTop,
#cinemaBottom{
    position:fixed;
    left:0;
    width:100%;
    height:5.5vh;
    background:#050505;
    z-index:20;
    pointer-events:none;
}

#cinemaTop{
    top:0;
}

#cinemaBottom{
    bottom:0;
}

/* Затемнение по краям */

#vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 45%,
            rgba(0,0,0,.12) 68%,
            rgba(0,0,0,.48) 100%
        );
}

/* Верхняя панель */

#hud{
    position:fixed;
    top:calc(5.5vh + 10px);
    left:12px;
    right:12px;
    z-index:30;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.panel{
    background:rgba(15,20,24,.78);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    padding:10px 13px;
    color:white;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

#playerInfo{
    min-width:145px;
}

#playerName{
    font-size:14px;
    font-weight:bold;
    margin-bottom:5px;
}

#level{
    font-size:13px;
    color:#d9e8ed;
}

#xpBar{
    width:120px;
    height:6px;
    margin-top:7px;
    background:rgba(255,255,255,.18);
    border-radius:10px;
    overflow:hidden;
}

#xpFill{
    width:35%;
    height:100%;
    background:linear-gradient(90deg,#72d6a3,#b9f3d1);
    border-radius:10px;
}

#moneyInfo{
    text-align:right;
}

#money{
    font-size:17px;
    font-weight:bold;
}

#stars{
    font-size:13px;
    margin-top:4px;
    color:#ffd76a;
}

/* Задание */

#questBox{
    position:fixed;
    top:calc(5.5vh + 92px);
    left:50%;
    transform:translateX(-50%);
    z-index:30;

    width:min(420px,calc(100% - 30px));

    background:rgba(12,17,21,.78);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.13);
    border-radius:16px;

    padding:11px 15px;

    color:white;
    text-align:center;

    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

#questTitle{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:#9ed8c0;
    margin-bottom:4px;
}

#questText{
    font-size:14px;
    line-height:1.3;
}

/* Миникарта */

#miniMap{
    position:fixed;
    right:14px;
    bottom:calc(5.5vh + 14px);

    width:130px;
    height:95px;

    z-index:30;

    border-radius:13px;
    border:2px solid rgba(255,255,255,.45);

    background:rgba(10,15,18,.75);

    box-shadow:0 7px 25px rgba(0,0,0,.35);
}

/* Кнопка действия */

#actionButton{
    position:fixed;
    right:18px;
    bottom:calc(5.5vh + 125px);

    width:72px;
    height:72px;

    z-index:40;

    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;

    background:rgba(25,31,35,.82);
    color:white;

    font-size:12px;
    font-weight:bold;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12);

    display:none;
}

#actionButton:active{
    transform:scale(.94);
    background:rgba(50,60,65,.95);
}

/* Джойстик */

#joystick{
    position:fixed;
    left:22px;
    bottom:calc(5.5vh + 20px);

    width:125px;
    height:125px;

    z-index:40;

    border-radius:50%;

    background:rgba(20,27,30,.30);
    border:2px solid rgba(255,255,255,.20);

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.2),
        0 8px 25px rgba(0,0,0,.2);
}

#joystickStick{
    position:absolute;

    left:50%;
    top:50%;

    width:55px;
    height:55px;

    margin-left:-27.5px;
    margin-top:-27.5px;

    border-radius:50%;

    background:rgba(255,255,255,.72);
    border:2px solid rgba(255,255,255,.8);

    box-shadow:
        0 5px 15px rgba(0,0,0,.3);
}

/* Бег */

#runButton{
    position:fixed;
    left:165px;
    bottom:calc(5.5vh + 27px);

    width:62px;
    height:62px;

    z-index:40;

    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;

    background:rgba(20,27,30,.72);
    color:white;

    font-size:11px;
    font-weight:bold;

    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

#runButton.active{
    background:rgba(70,105,90,.9);
}

/* Подсказка */

#hint{
    position:fixed;
    left:50%;
    bottom:calc(5.5vh + 10px);

    transform:translateX(-50%);

    z-index:35;

    color:rgba(255,255,255,.75);

    font-size:11px;

    background:rgba(0,0,0,.35);
    padding:6px 10px;
    border-radius:10px;

    pointer-events:none;
}

@media(max-width:600px){

    #hud{
        top:calc(5.5vh + 7px);
        left:8px;
        right:8px;
    }

    .panel{
        padding:8px 10px;
        border-radius:12px;
    }

    #playerInfo{
        min-width:125px;
    }

    #playerName{
        font-size:12px;
    }

    #level{
        font-size:11px;
    }

    #money{
        font-size:14px;
    }

    #questBox{
        top:calc(5.5vh + 72px);
        width:calc(100% - 24px);
    }

    #questText{
        font-size:12px;
    }

    #miniMap{
        width:105px;
        height:78px;
        right:10px;
        bottom:calc(5.5vh + 10px);
    }

    #actionButton{
        width:64px;
        height:64px;
        right:10px;
        bottom:calc(5.5vh + 100px);
    }

    #joystick{
        left:14px;
        bottom:calc(5.5vh + 12px);
        width:110px;
        height:110px;
    }

    #joystickStick{
        width:50px;
        height:50px;
        margin-left:-25px;
        margin-top:-25px;
    }

    #runButton{
        left:132px;
        bottom:calc(5.5vh + 20px);
        width:55px;
        height:55px;
    }

    #hint{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="cinemaTop"></div>
<div id="cinemaBottom"></div>
<div id="vignette"></div>

<div id="hud">

    <div id="playerInfo" class="panel">
        <div id="playerName">НАСТЯ</div>

        <div id="level">
            Уровень <span id="levelNumber">1</span>
        </div>

        <div id="xpBar">
            <div id="xpFill"></div>
        </div>
    </div>

    <div id="moneyInfo" class="panel">

        <div id="money">
            💰 <span id="moneyNumber">100</span>
        </div>

        <div id="stars">
            ⭐ <span id="starNumber">0</span>
        </div>

    </div>

</div>

<div id="questBox">

    <div id="questTitle">
        НОВОЕ ЗАДАНИЕ
    </div>

    <div id="questText">
        Найди Алину
    </div>

</div>

<canvas id="miniMap"></canvas>

<button id="actionButton">
    ВЗАИМОДЕЙСТВИЕ
</button>

<div id="joystick">
    <div id="joystickStick"></div>
</div>

<button id="runButton">
    БЕГ
</button>

<div id="hint">
    Используй джойстик для движения
</div>

<script>

/* =========================================
   НОВЫЙ ШАГ — КИНЕМАТОГРАФИЧЕСКАЯ ВЕРСИЯ
   ЧАСТЬ 1
========================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const miniMap = document.getElementById("miniMap");
const miniCtx = miniMap.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    miniMap.width = 260;
    miniMap.height = 190;
}

window.addEventListener("resize", resize);

resize();


/* =========================================
   МИР
========================================= */

const WORLD_W = 3200;
const WORLD_H = 2400;


/* =========================================
   ИГРОК
========================================= */

const player = {

    x:1600,
    y:1210,

    width:32,
    height:42,

    /* Обычная скорость теперь спокойная */

    walkSpeed:5.2,

    /* Бег тоже умеренный */

    runSpeed:8.5,

    direction:"down",

    moving:false
};


/* =========================================
   КАМЕРА
========================================= */

const camera = {

    x:0,
    y:0,

    smooth:0.09
};


/* =========================================
   СОСТОЯНИЕ ИГРЫ
========================================= */

let money = 100;

let xp = 0;

let level = 1;

let stars = 0;

let quest = 0;


/* =========================================
   УПРАВЛЕНИЕ
========================================= */

const keys = {};

window.addEventListener("keydown",function(e){

    keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()] = false;

});


/* =========================================
   ДЖОЙСТИК
========================================= */

const joystick =
    document.getElementById("joystick");

const joystickStick =
    document.getElementById("joystickStick");

let joystickActive = false;

let joystickX = 0;
let joystickY = 0;

function joystickMove(clientX,clientY){

    const rect = joystick.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;

    const maxDistance =
        rect.width * 0.32;

    const distance =
        Math.sqrt(dx*dx + dy*dy);

    if(distance > maxDistance){

        dx =
            dx / distance * maxDistance;

        dy =
            dy / distance * maxDistance;
    }

    joystickX = dx / maxDistance;
    joystickY = dy / maxDistance;

    joystickStick.style.transform =
        `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener("pointerdown",function(e){

    joystickActive = true;

    joystick.setPointerCapture(e.pointerId);

    joystickMove(e.clientX,e.clientY);

});


joystick.addEventListener("pointermove",function(e){

    if(!joystickActive) return;

    joystickMove(e.clientX,e.clientY);

});


joystick.addEventListener("pointerup",function(){

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    joystickStick.style.transform =
        "translate(0,0)";
});


/* =========================================
   КНОПКА БЕГА
========================================= */

const runButton =
    document.getElementById("runButton");

let running = false;

runButton.addEventListener("pointerdown",function(){

    running = true;

    runButton.classList.add("active");

});

runButton.addEventListener("pointerup",function(){

    running = false;

    runButton.classList.remove("active");

});

runButton.addEventListener("pointercancel",function(){

    running = false;

    runButton.classList.remove("active");

});


/* =========================================
   ДАЛЬШЕ БУДЕТ КАРТА
========================================= */

</script>

</body>
</html>
