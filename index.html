<title>Новый Шаг</title>
<canvas id="game"></canvas>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Новый Шаг</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#cinema{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.08) 65%,
            rgba(0,0,0,.42) 100%
        );
}

.bar{
    position:fixed;
    left:0;
    width:100%;
    height:5vh;
    background:#050505;
    z-index:30;
    pointer-events:none;
}

#topBar{top:0}
#bottomBar{bottom:0}

#hud{
    position:fixed;
    top:calc(5vh + 10px);
    left:12px;
    right:12px;
    z-index:40;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.box{
    color:white;
    background:rgba(12,18,21,.76);
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    padding:9px 12px;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

#name{
    font-size:14px;
    font-weight:bold;
}

#level{
    margin-top:3px;
    font-size:12px;
    opacity:.8;
}

#xp{
    width:120px;
    height:5px;
    margin-top:7px;
    background:rgba(255,255,255,.15);
    border-radius:5px;
    overflow:hidden;
}

#xpFill{
    width:20%;
    height:100%;
    background:#a9d7bd;
}

#money{
    font-weight:bold;
    font-size:16px;
}

#stars{
    margin-top:4px;
    color:#ffd86a;
    font-size:12px;
}

#quest{
    position:fixed;
    top:calc(5vh + 78px);
    left:50%;
    transform:translateX(-50%);
    width:min(420px,calc(100% - 24px));
    padding:10px 15px;
    z-index:40;
    text-align:center;
    color:white;
    background:rgba(12,18,21,.76);
    border:1px solid rgba(255,255,255,.13);
    border-radius:14px;
    backdrop-filter:blur(10px);
}

#questTitle{
    font-size:10px;
    letter-spacing:2px;
    color:#a7d9bd;
    margin-bottom:4px;
}

#questText{
    font-size:13px;
}

#mini{
    position:fixed;
    right:12px;
    bottom:calc(5vh + 12px);
    width:115px;
    height:85px;
    z-index:40;
    border:2px solid rgba(255,255,255,.45);
    border-radius:12px;
    background:#17201d;
}

#joystick{
    position:fixed;
    left:18px;
    bottom:calc(5vh + 15px);
    width:115px;
    height:115px;
    z-index:50;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.2);
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:52px;
    height:52px;
    margin:-26px;
    border-radius:50%;
    background:rgba(255,255,255,.72);
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

button{
    border:0;
    color:white;
    font-weight:bold;
    background:rgba(15,22,25,.82);
}

#run{
    position:fixed;
    left:145px;
    bottom:calc(5vh + 27px);
    width:58px;
    height:58px;
    border-radius:50%;
    z-index:50;
    font-size:11px;
    border:1px solid rgba(255,255,255,.2);
}

#run.active{
    background:rgba(65,105,82,.95);
}

#action{
    position:fixed;
    right:20px;
    bottom:calc(5vh + 110px);
    width:68px;
    height:68px;
    border-radius:50%;
    z-index:50;
    display:none;
    font-size:10px;
    border:1px solid rgba(255,255,255,.2);
}

@media(max-width:600px){

    #hud{
        top:calc(5vh + 6px);
        left:7px;
        right:7px;
    }

    .box{
        padding:7px 9px;
    }

    #name{
        font-size:12px;
    }

    #money{
        font-size:14px;
    }

    #quest{
        top:calc(5vh + 65px);
    }

    #questText{
        font-size:12px;
    }

    #mini{
        width:100px;
        height:74px;
        right:9px;
        bottom:calc(5vh + 9px);
    }

    #joystick{
        left:12px;
        bottom:calc(5vh + 10px);
        width:105px;
        height:105px;
    }

    #run{
        left:126px;
        bottom:calc(5vh + 20px);
        width:52px;
        height:52px;
    }

    #action{
        right:10px;
        bottom:calc(5vh + 92px);
        width:62px;
        height:62px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="cinema"></div>
<div class="bar" id="topBar"></div>
<div class="bar" id="bottomBar"></div>

<div id="hud">

    <div class="box">
        <div id="name">НАСТЯ</div>
        <div id="level">Уровень 1</div>
        <div id="xp">
            <div id="xpFill"></div>
        </div>
    </div>

    <div class="box" style="text-align:right">
        <div id="money">💰 100</div>
        <div id="stars">⭐ 0</div>
    </div>

</div>

<div id="quest">
    <div id="questTitle">ЗАДАНИЕ</div>
    <div id="questText">Найди Алину</div>
</div>

<canvas id="mini"></canvas>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="run">БЕГ</button>
<button id="action">ВЗАИМОДЕЙСТВИЕ</button>

<script>
/* =====================================================
   НОВЫЙ ШАГ
   ПОЛНАЯ КИНЕМАТОГРАФИЧЕСКАЯ ВЕРСИЯ
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const mini=document.getElementById("mini");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
    mini.width=230;
    mini.height=170;
}

addEventListener("resize",resize);
resize();

/* =====================================================
   МИР
===================================================== */

const WORLD_W=3200;
const WORLD_H=2400;

const roads=[
    {x:0,y:420,w:WORLD_W,h:180},
    {x:0,y:1110,w:WORLD_W,h:190},
    {x:520,y:0,w:180,h:WORLD_H},
    {x:1480,y:0,w:190,h:WORLD_H},
    {x:2520,y:0,w:190,h:WORLD_H}
];

/* =====================================================
   ИГРОК
===================================================== */

const player={
    x:1600,
    y:1200,
    r:17,
    walkSpeed:5,
    runSpeed:7.5,
    dir:"down"
};

/* =====================================================
   КАМЕРА
===================================================== */

const camera={
    x:0,
    y:0
};

/* =====================================================
   ИГРА
===================================================== */

let money=100;
let xp=0;
let level=1;
let stars=0;
let quest=0;

const keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

/* =====================================================
   ДЖОЙСТИК
===================================================== */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyActive=false;

function moveJoy(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=35;
    const d=Math.hypot(dx,dy);

    if(d>max){
        dx=dx/d*max;
        dy=dy/d*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

joystick.addEventListener("pointerdown",e=>{
    joyActive=true;
    joystick.setPointerCapture(e.pointerId);
    moveJoy(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{
    if(joyActive) moveJoy(e.clientX,e.clientY);
});

function joyStop(){
    joyActive=false;
    joyX=0;
    joyY=0;
    stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",joyStop);
joystick.addEventListener("pointercancel",joyStop);

/* =====================================================
   БЕГ
===================================================== */

const run=document.getElementById("run");
let running=false;

run.addEventListener("pointerdown",()=>{
    running=true;
    run.classList.add("active");
});

run.addEventListener("pointerup",()=>{
    running=false;
    run.classList.remove("active");
});

run.addEventListener("pointercancel",()=>{
    running=false;
    run.classList.remove("active");
});

/* =====================================================
   ЗДАНИЯ
===================================================== */

const buildings=[];

function addBuilding(x,y,w,h,name=""){
    buildings.push({
        x,y,w,h,name,
        tone:Math.floor(Math.random()*3)
    });
}

/* верхний район */

addBuilding(40,50,370,280);
addBuilding(760,50,420,280);
addBuilding(1200,70,210,250);
addBuilding(1740,50,420,300);
addBuilding(2200,60,250,290);
addBuilding(2750,50,350,300);

addBuilding(30,650,400,350);
addBuilding(760,650,300,340);
addBuilding(1110,650,270,340);
addBuilding(1770,650,400,350);
addBuilding(2200,650,250,350);
addBuilding(2770,650,350,350);

/* нижний район */

addBuilding(30,1400,380,350);
addBuilding(760,1410,370,320);
addBuilding(1190,1400,230,340);
addBuilding(1740,1410,420,330);
addBuilding(2210,1400,250,350);
addBuilding(2770,1400,360,340);

addBuilding(40,1830,400,330);
addBuilding(760,1820,350,350);
addBuilding(1190,1820,240,350);
addBuilding(1740,1820,400,340);
addBuilding(2210,1820,250,340);
addBuilding(2760,1820,380,340);

/* =====================================================
   ПАРКИ
===================================================== */

const parks=[
    {x:780,y:365,w:580,h:210},
    {x:1810,y:360,w:590,h:220},
    {x:770,y:1330,w:600,h:60},
    {x:1800,y:1320,w:600,h:70}
];

/* =====================================================
   ДЕРЕВЬЯ
===================================================== */

const trees=[];

function createTrees(){

    for(const p of parks){

        for(let i=0;i<35;i++){

            trees.push({
                x:p.x+20+Math.random()*(p.w-40),
                y:p.y+20+Math.random()*(p.h-40),
                s:.75+Math.random()*.6
            });
        }
    }

    for(let i=0;i<120;i++){

        let x=Math.random()*WORLD_W;
        let y=Math.random()*WORLD_H;

        let onRoad=roads.some(r=>
            x>r.x-25 &&
            x<r.x+r.w+25 &&
            y>r.y-25 &&
            y<r.y+r.h+25
        );

        if(!onRoad){
            trees.push({
                x,
                y,
                s:.6+Math.random()*.6
            });
        }
    }
}

createTrees();

/* =====================================================
   NPC
===================================================== */

const alina={
    x:1040,
    y:390,
    r:18,
    name:"Алина"
};

/* =====================================================
   ПОСЫЛКА
===================================================== */

const parcel={
    x:270,
    y:1040,
    active:false,
    taken:false
};

/* =====================================================
   МАШИНЫ
===================================================== */

const cars=[];

for(let i=0;i<18;i++){

    const horizontal=Math.random()<.5;

    cars.push({
        x:Math.random()*WORLD_W,
        y:horizontal
            ? (Math.random()<.5?460:1190)
            : Math.random()*WORLD_H,

        horizontal,
        speed:1.5+Math.random()*1.5,
        color:[
            "#d95c52",
            "#527fa6",
            "#d4a84e",
            "#e7e7e7",
            "#3d4a50",
            "#8a6f92"
        ][i%6]
    });
}

/* =====================================================
   ЦВЕТА
===================================================== */

const buildingColors=[
    "#59646b",
    "#68747a",
    "#766c67",
    "#596b68"
];

/* =====================================================
   ПОМОЩНИКИ
===================================================== */

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function dist(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function nearRoad(x,y){

    return roads.some(r=>
        x>r.x &&
        x<r.x+r.w &&
        y>r.y &&
        y<r.y+r.h
    );
}

/* =====================================================
   КОЛЛИЗИИ
===================================================== */

function blocked(x,y){

    for(const b of buildings){

        if(
            x> b.x-20 &&
            x< b.x+b.w+20 &&
            y> b.y-20 &&
            y< b.y+b.h+20
        ){
            return true;
        }
    }

    return false;
}

/* =====================================================
   ДВИЖЕНИЕ
===================================================== */

function updatePlayer(){

    let dx=0;
    let dy=0;

    if(keys["arrowleft"]||keys["a"]) dx-=1;
    if(keys["arrowright"]||keys["d"]) dx+=1;
    if(keys["arrowup"]||keys["w"]) dy-=1;
    if(keys["arrowdown"]||keys["s"]) dy+=1;

    if(Math.abs(joyX)>.08) dx=joyX;
    if(Math.abs(joyY)>.08) dy=joyY;

    if(dx!==0||dy!==0){

        const len=Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        player.dir=
            Math.abs(dx)>Math.abs(dy)
            ? (dx>0?"right":"left")
            : (dy>0?"down":"up");

        const speed=
            running
            ? player.runSpeed
            : player.walkSpeed;

        const nx=player.x+dx*speed;
        const ny=player.y+dy*speed;

        if(
            nx>20 &&
            nx<WORLD_W-20 &&
            !blocked(nx,player.y)
        ){
            player.x=nx;
        }

        if(
            ny>20 &&
            ny<WORLD_H-20 &&
            !blocked(player.x,ny)
        ){
            player.y=ny;
        }

        player.moving=true;

    }else{
        player.moving=false;
    }
}

/* =====================================================
   МАШИНЫ
===================================================== */

function updateCars(){

    for(const c of cars){

        if(c.horizontal){

            c.x+=c.speed;

            if(c.x>WORLD_W+100)
                c.x=-100;

        }else{

            c.y+=c.speed;

            if(c.y>WORLD_H+100)
                c.y=-100;
        }
    }
}

/* =====================================================
   КВЕСТ
===================================================== */

function updateQuest(){

    const dAlina=dist(player,alina);
    const dParcel=dist(player,parcel);

    if(quest===0){

        document.getElementById("questText").textContent=
            "Найди Алину в городе";

        if(dAlina<65){
            document.getElementById("action").style.display="block";
        }else{
            document.getElementById("action").style.display="none";
        }
    }

    else if(quest===1){

        document.getElementById("questText").textContent=
            "Отправляйся на почту за посылкой";

        document.getElementById("action").style.display=
            dParcel<70 ? "block":"none";
    }

    else if(quest===2){

        document.getElementById("questText").textContent=
            "Забери посылку";

        document.getElementById("action").style.display=
            dParcel<70 ? "block":"none";
    }

    else if(quest===3){

        document.getElementById("questText").textContent=
            "Вернись к Алине";

        document.getElementById("action").style.display=
            dAlina<70 ? "block":"none";
    }

    else if(quest===4){

        document.getElementById("questText").textContent=
            "Поговори с Алиной";

        document.getElementById("action").style.display=
            dAlina<70 ? "block":"none";
    }

    else{

        document.getElementById("questText").textContent=
            "Задание выполнено ✨";

        document.getElementById("action").style.display="none";
    }
}

/* =====================================================
   ДЕЙСТВИЕ
===================================================== */

document.getElementById("action").addEventListener("click",()=>{

    const dAlina=dist(player,alina);
    const dParcel=dist(player,parcel);

    if(quest===0 && dAlina<70){

        quest=1;
        xp+=25;
        stars++;

    }else if(quest===1 && dParcel<75){

        quest=2;
        parcel.active=true;

    }else if(quest===2 && dParcel<75){

        quest=3;
        parcel.taken=true;
        money+=50;
        xp+=35;

    }else if(quest===3 && dAlina<75){

        quest=4;
        xp+=25;

    }else if(quest===4 && dAlina<75){

        quest=5;
        money+=150;
        xp+=70;
        stars+=2;
    }

    updateStats();
});

/* =====================================================
   СТАТИСТИКА
===================================================== */

function updateStats(){

    while(xp>=100){

        xp-=100;
        level++;
    }

    document.getElementById("level").textContent=
        "Уровень "+level;

    document.getElementById("money").textContent=
        "💰 "+money;

    document.getElementById("stars").textContent=
        "⭐ "+stars;

    document.getElementById("xpFill").style.width=
        xp+"%";
}

/* =====================================================
   КАМЕРА
===================================================== */

function updateCamera(){

    const targetX=
        player.x-W/2;

    const targetY=
        player.y-H/2;

    camera.x+=(targetX-camera.x)*.08;
    camera.y+=(targetY-camera.y)*.08;

    camera.x=clamp(
        camera.x,
        0,
        WORLD_W-W
    );

    camera.y=clamp(
        camera.y,
        0,
        WORLD_H-H
    );
}

/* =====================================================
   НЕБО
===================================================== */

function drawSky(){

    const g=ctx.createLinearGradient(
        0,0,0,H
    );

    g.addColorStop(0,"#263b52");
    g.addColorStop(.35,"#6f8790");
    g.addColorStop(.7,"#b5a28d");
    g.addColorStop(1,"#554e4a");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
}

/* =====================================================
   МИР
===================================================== */

function drawWorld(){

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    /* земля */

    ctx.fillStyle="#7c887d";
    ctx.fillRect(
        0,0,
        WORLD_W,
        WORLD_H
    );

    /* газоны */

    for(const p of parks){

        const g=ctx.createLinearGradient(
            p.x,p.y,
            p.x,p.y+p.h
        );

        g.addColorStop(0,"#637968");
        g.addColorStop(1,"#415b49");

        ctx.fillStyle=g;

        ctx.fillRect(
            p.x,p.y,
            p.w,p.h
        );
    }

    /* дороги */

    for(const r of roads){

        ctx.fillStyle="#343a3d";

        ctx.fillRect(
            r.x,r.y,
            r.w,r.h
        );

        /* края дороги */

        ctx.strokeStyle="rgba(255,255,255,.10)";
        ctx.lineWidth=5;

        ctx.strokeRect(
            r.x,r.y,
            r.w,r.h
        );

        /* разметка */

        ctx.strokeStyle="rgba(235,215,150,.55)";
        ctx.lineWidth=3;
        ctx.setLineDash([28,24]);

        if(r.w>r.h){

            const cy=r.y+r.h/2;

            ctx.beginPath();
            ctx.moveTo(r.x,cy);
            ctx.lineTo(r.x+r.w,cy);
            ctx.stroke();

        }else{

            const cx=r.x+r.w/2;

            ctx.beginPath();
            ctx.moveTo(cx,r.y);
            ctx.lineTo(cx,r.y+r.h);
            ctx.stroke();
        }

        ctx.setLineDash([]);
    }

    /* здания */

    for(const b of buildings){

        /* тень здания */

        ctx.fillStyle="rgba(0,0,0,.25)";

        ctx.fillRect(
            b.x+14,
            b.y+16,
            b.w,
            b.h
        );

        /* фасад */

        const grad=ctx.createLinearGradient(
            b.x,b.y,
            b.x,b.y+b.h
        );

        grad.addColorStop(
            0,
            buildingColors[b.tone]
        );

        grad.addColorStop(
            1,
            "#343d41"
        );

        ctx.fillStyle=grad;

        ctx.fillRect(
            b.x,b.y,
            b.w,b.h
        );

        /* крыша */

        ctx.fillStyle="rgba(25,30,32,.7)";

        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            13
        );

        /* окна */

        for(let xx=b.x+24;xx<b.x+b.w-15;xx+=45){

            for(let yy=b.y+35;yy<b.y+b.h-20;yy+=45){

                ctx.fillStyle=
                    ((xx+yy)/45)%2<1
                    ? "#a7c6ca"
                    : "#6f969d";

                ctx.fillRect(
                    xx,
                    yy,
                    22,
                    16
                );
            }
        }

        /* вход */

        ctx.fillStyle="#20282b";

        ctx.fillRect(
            b.x+b.w/2-14,
            b.y+b.h-45,
            28,
            45
        );
    }

    /* деревья */

    for(const t of trees){

        /* тень */

        ctx.fillStyle="rgba(0,0,0,.22)";

        ctx.beginPath();

        ctx.ellipse(
            t.x+7,
            t.y+14,
            18*t.s,
            8*t.s,
            0,0,Math.PI*2
        );

        ctx.fill();

        /* ствол */

        ctx.fillStyle="#5b4537";

        ctx.fillRect(
            t.x-3*t.s,
            t.y,
            6*t.s,
            18*t.s
        );

        /* крона */

        const tg=ctx.createRadialGradient(
            t.x-5*t.s,
            t.y-8*t.s,
            2,
            t.x,
            t.y,
            24*t.s
        );

        tg.addColorStop(0,"#708f72");
        tg.addColorStop(1,"#263f30");

        ctx.fillStyle=tg;

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y-8*t.s,
            22*t.s,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* машины */

    for(const c of cars){

        ctx.save();

        ctx.translate(c.x,c.y);

        if(c.horizontal)
            ctx.rotate(0);
        else
            ctx.rotate(Math.PI/2);

        ctx.fillStyle="rgba(0,0,0,.25)";

        ctx.fillRect(
            -23,
            -11,
            50,
            25
        );

        ctx.fillStyle=c.color;

        ctx.fillRect(
            -25,
            -10,
            50,
            20
        );

        ctx.fillStyle="#91adb4";

        ctx.fillRect(
            -10,
            -7,
            18,
            14
        );

        ctx.fillStyle="#222";

        ctx.fillRect(-20,-13,9,5);
        ctx.fillRect(10,-13,9,5);
        ctx.fillRect(-20,8,9,5);
        ctx.fillRect(10,8,9,5);

        ctx.restore();
    }

    /* почта */

    drawPlace(
        270,
        1040,
        "ПОЧТА",
        "#9b6f56"
    );

    /* кафе */

    drawPlace(
        1080,
        650,
        "КАФЕ",
        "#876b4e"
    );

    /* магазин */

    drawPlace(
        2200,
        650,
        "МАГАЗИН",
        "#536e75"
    );

    /* посылка */

    if(!parcel.taken){

        ctx.fillStyle="#c78b49";

        ctx.fillRect(
            parcel.x-15,
            parcel.y-12,
            30,
            24
        );

        ctx.strokeStyle="#704a29";
        ctx.lineWidth=3;

        ctx.strokeRect(
            parcel.x-15,
            parcel.y-12,
            30,
            24
        );

        ctx.fillStyle="#e6c18b";

        ctx.fillRect(
            parcel.x-2,
            parcel.y-12,
            4,
            24
        );
    }

    /* Алина */

    drawCharacter(
        alina.x,
        alina.y,
        "#d69a9a",
        "А"
    );

    /* игрок */

    drawCharacter(
        player.x,
        player.y,
        "#7ea6c8",
        "Я"
    );

    ctx.restore();
}

/* =====================================================
   МЕСТА
===================================================== */

function drawPlace(x,y,text,color){

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillRect(
        x+8,y+10,
        120,55
    );

    ctx.fillStyle=color;

    ctx.fillRect(
        x,y,
        120,55
    );

    ctx.fillStyle="rgba(255,255,255,.85)";
    ctx.font="bold 15px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        text,
        x+60,
        y+34
    );
}

/* =====================================================
   ПЕРСОНАЖ
===================================================== */

function drawCharacter(x,y,color,letter){

    /* тень */

    ctx.fillStyle="rgba(0,0,0,.30)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+24,
        19,
        8,
        0,0,Math.PI*2
    );

    ctx.fill();

    /* тело */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.roundRect(
        x-13,
        y-2,
        26,
        31,
        8
    );

    ctx.fill();

    /* голова */

    ctx.fillStyle="#e4b39b";

    ctx.beginPath();

    ctx.arc(
        x,
        y-13,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* волосы */

    ctx.fillStyle="#3b2d2a";

    ctx.beginPath();

    ctx.arc(
        x,
        y-17,
        12,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    /* буква */

    ctx.fillStyle="white";
    ctx.font="bold 10px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        letter,
        x,
        y+17
    );
}

/* =====================================================
   МИНИКАРТА
===================================================== */

function drawMiniMap(){

    const sx=mini.width/WORLD_W;
    const sy=mini.height/WORLD_H;

    mctx.clearRect(
        0,0,
        mini.width,
        mini.height
    );

    mctx.fillStyle="#607064";

    mctx.fillRect(
        0,0,
        mini.width,
        mini.height
    );

    for(const r of roads){

        mctx.fillStyle="#363c3e";

        mctx.fillRect(
            r.x*sx,
            r.y*sy,
            r.w*sx,
            r.h*sy
        );
    }

    for(const p of parks){

        mctx.fillStyle="#49644e";

        mctx.fillRect(
            p.x*sx,
            p.y*sy,
            p.w*sx,
            p.h*sy
        );
    }

    /* Алина */

    mctx.fillStyle="#f3a1a1";

    mctx.beginPath();

    mctx.arc(
        alina.x*sx,
        alina.y*sy,
        4,
        0,
        Math.PI*2
    );

    mctx.fill();

    /* игрок */

    mctx.fillStyle="#ffffff";

    mctx.beginPath();

    mctx.arc(
        player.x*sx,
        player.y*sy,
        4,
        0,
        Math.PI*2
    );

    mctx.fill();
}

/* =====================================================
   КИНЕМАТОГРАФИЧЕСКИЙ СВЕТ
===================================================== */

function drawLighting(){

    const gradient=ctx.createRadialGradient(
        W*.52,
        H*.30,
        20,
        W*.52,
        H*.40,
        Math.max(W,H)*.75
    );

    gradient.addColorStop(
        0,
        "rgba(255,220,170,.08)"
    );

    gradient.addColorStop(
        .55,
        "rgba(255,190,120,.025)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.32)"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );
}

/* =====================================================
   ИГРОВОЙ ЦИКЛ
===================================================== */

function loop(){

    updatePlayer();
    updateCars();
    updateCamera();
    updateQuest();
    updateStats();

    drawSky();
    drawWorld();
    drawLighting();
    drawMiniMap();

    requestAnimationFrame(loop);
}

loop();

</script>
