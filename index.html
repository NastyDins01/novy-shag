<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Город после полуночи</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03050a;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(#070b14 0%, #101a29 48%, #080b10 100%);
}

/* Луна */

#moon {
    position: absolute;
    width: 75px;
    height: 75px;
    right: 12%;
    top: 9%;
    border-radius: 50%;
    background: #dce7ef;
    box-shadow: 0 0 40px #9eb9ce;
}

/* Дорога */

#road {
    position: absolute;
    left: 25%;
    bottom: 0;
    width: 50%;
    height: 82%;
    background: #151922;
    clip-path: polygon(42% 0,58% 0,100% 100%,0 100%);
}

/* Тротуары */

.side {
    position: absolute;
    bottom: 0;
    width: 30%;
    height: 65%;
    background: #10141a;
}

#leftSide {
    left: 0;
    clip-path: polygon(0 25%,100% 0,100% 100%,0 100%);
}

#rightSide {
    right: 0;
    clip-path: polygon(0 0,100% 25%,100% 100%,0 100%);
}

/* Дома */

.building {
    position: absolute;
    bottom: 34%;
    width: 25%;
    height: 32%;
    background: #191d25;
    border: 3px solid #07090d;
    box-shadow: 0 12px 35px #000;
}

#house {
    left: 4%;
}

#shop {
    right: 4%;
}

.building .roof {
    position: absolute;
    top: -18px;
    left: -5px;
    width: calc(100% + 10px);
    height: 25px;
    background: #0c0e13;
    transform: skewX(-25deg);
}

.window {
    position: absolute;
    width: 25px;
    height: 35px;
    background: #202731;
    border: 3px solid #080a0e;
}

.window.on {
    background: #b39b5b;
    box-shadow: 0 0 15px #b39b5b;
}

#house .w1 {
    left: 20%;
    top: 30%;
}

#house .w2 {
    right: 20%;
    top: 30%;
}

#house .w3 {
    left: 42%;
    bottom: 12%;
}

#shop .w1 {
    left: 18%;
    top: 28%;
}

#shop .w2 {
    right: 18%;
    top: 28%;
}

/* Школа */

#school {
    position: absolute;
    left: 37%;
    top: 20%;
    width: 26%;
    height: 20%;
    background: #20242c;
    border: 3px solid #090b10;
    box-shadow: 0 8px 25px #000;
}

#schoolLight {
    position: absolute;
    width: 22px;
    height: 28px;
    left: 47%;
    top: 30%;
    background: #d7bd69;
    box-shadow: 0 0 20px #d7bd69;
}

/* Надписи */

.sign {
    position: absolute;
    left: 50%;
    top: 7px;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    color: #9ca7b1;
}

/* Туман */

.fog {
    position: absolute;
    left: -20%;
    bottom: 15%;
    width: 140%;
    height: 25%;
    background: rgba(190,205,215,.08);
    filter: blur(25px);
    animation: fogMove 10s infinite alternate;
}

@keyframes fogMove {
    from { transform: translateX(-4%); }
    to { transform: translateX(4%); }
}

/* Игрок */

#player {
    position: absolute;
    z-index: 20;
    width: 30px;
    height: 52px;
    transform: translate(-50%,-50%);
}

#head {
    position: absolute;
    left: 6px;
    top: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #c98e69;
}

#body {
    position: absolute;
    left: 4px;
    top: 17px;
    width: 22px;
    height: 27px;
    border-radius: 6px;
    background: #314052;
}

#leg1, #leg2 {
    position: absolute;
    top: 42px;
    width: 7px;
    height: 15px;
    background: #111722;
}

#leg1 {
    left: 5px;
}

#leg2 {
    left: 18px;
}

/* Фонарик */

#light {
    position: absolute;
    z-index: 10;
    pointer-events: none;
    width: 300px;
    height: 300px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255,245,190,.25) 0%,
        rgba(255,245,190,.12) 25%,
        rgba(255,245,190,.03) 55%,
        transparent 70%
    );
}

/* Интерфейс */

#title {
    position: absolute;
    z-index: 50;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    font-size: 17px;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px #000;
}

#message {
    position: absolute;
    z-index: 50;
    top: 48px;
    left: 5%;
    width: 90%;
    text-align: center;
    font-size: 14px;
    color: #c1cad2;
}

/* Кнопка взаимодействия */

#action {
    display: none;
    position: absolute;
    z-index: 80;
    left: 50%;
    bottom: 135px;
    transform: translateX(-50%);
    border: 0;
    border-radius: 14px;
    padding: 15px 30px;
    background: #d2b263;
    color: #15120b;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 0 25px rgba(210,178,99,.4);
}

/* Джойстик */

#joystick {
    position: absolute;
    z-index: 70;
    left: 20px;
    bottom: 20px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07);
}

#stick {
    position: absolute;
    left: 33px;
    top: 33px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: rgba(220,230,240,.35);
}

/* Фонарик */

#flashButton {
    position: absolute;
    z-index: 70;
    right: 25px;
    bottom: 38px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.1);
    color: white;
    font-size: 27px;
}

/* Интерьер */

#inside {
    display: none;
    position: absolute;
    z-index: 200;
    inset: 0;
    background:
        radial-gradient(circle at 50% 42%,
        #41362c 0%,
        #1b1511 45%,
        #050403 100%);
}

#inside h2 {
    margin: 25px 0 0;
    text-align: center;
    letter-spacing: 3px;
}

#door {
    position: absolute;
    left: 50%;
    top: 15%;
    transform: translateX(-50%);
    width: 110px;
    height: 190px;
    background: #17100d;
    border: 6px solid #080605;
}

#table {
    position: absolute;
    left: 20%;
    bottom: 28%;
    width: 60%;
    height: 18px;
    background: #241811;
}

#key {
    position: absolute;
    z-index: 210;
    left: 50%;
    top: 52%;
    transform: translate(-50%,-50%);
    font-size: 65px;
    cursor: pointer;
    filter: drop-shadow(0 0 15px #ffd85e);
}

#insideText {
    position: absolute;
    left: 10%;
    width: 80%;
    top: 64%;
    text-align: center;
    color: #d1d1d1;
    font-size: 14px;
}

#exit {
    position: absolute;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    padding: 14px 35px;
    border: 0;
    border-radius: 12px;
    background: #363636;
    color: white;
    font-size: 16px;
}

/* Инвентарь */

#inventory {
    position: absolute;
    z-index: 90;
    right: 15px;
    top: 15px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.5);
    font-size: 14px;
}
</style>
</head>

<body>

<div id="game">

    <div id="moon"></div>

    <div id="title">
        ГОРОД ПОСЛЕ ПОЛУНОЧИ
    </div>

    <div id="message">
        Ты проснулся посреди пустого города...
    </div>

    <div id="inventory">
        🎒 Пусто
    </div>

    <div id="road"></div>

    <div id="leftSide" class="side"></div>
    <div id="rightSide" class="side"></div>

    <div id="house" class="building">

        <div class="roof"></div>

        <div class="sign">ДОМ</div>

        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="window w3"></div>

    </div>

    <div id="shop" class="building">

        <div class="roof"></div>

        <div class="sign">МАГАЗИН</div>

        <div class="window w1"></div>
        <div class="window w2"></div>

    </div>

    <div id="school">

        <div class="sign">
            ШКОЛА
        </div>

        <div id="schoolLight"></div>

    </div>

    <div class="fog"></div>

    <div id="light"></div>

    <div id="player">

        <div id="head"></div>
        <div id="body"></div>
        <div id="leg1"></div>
        <div id="leg2"></div>

    </div>

    <button id="action">
        🚪 ВОЙТИ В ДОМ
    </button>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="flashButton">
        🔦
    </button>


    <!-- ДОМ -->

    <div id="inside">

        <h2>
            СТАРЫЙ ДОМ
        </h2>

        <div id="door"></div>

        <div id="table"></div>

        <div id="key">
            🔑
        </div>

        <div id="insideText">
            На столе лежит старый ключ.
            <br><br>
            Нажми на ключ, чтобы подобрать его.
        </div>

        <button id="exit">
            ↩ ВЫЙТИ
        </button>

    </div>

</div>


<script>

/* =========================
   СОСТОЯНИЕ ИГРЫ
========================= */

let playerX = window.innerWidth / 2;
let playerY = window.innerHeight * .72;

let moveX = 0;
let moveY = 0;

let joystickActive = false;

let flashlightOn = true;

let insideHouse = false;

let hasKey = false;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const player =
    document.getElementById("player");

const light =
    document.getElementById("light");

const message =
    document.getElementById("message");

const action =
    document.getElementById("action");

const inside =
    document.getElementById("inside");

const key =
    document.getElementById("key");

const exit =
    document.getElementById("exit");

const inventory =
    document.getElementById("inventory");

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

const flashButton =
    document.getElementById("flashButton");


/* =========================
   ИГРОК
========================= */

function drawPlayer() {

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

    light.style.left =
        playerX + "px";

    light.style.top =
        (playerY - 20) + "px";
}


/* =========================
   ПРОВЕРКА ДОМА
========================= */

function checkHouse() {

    /*
       Дом находится слева.
       Зона входа специально большая,
       чтобы на телефоне было легко.
    */

    const nearHouse =
        playerX < window.innerWidth * .48 &&
        playerY > window.innerHeight * .30 &&
        playerY < window.innerHeight * .90;


    if (nearHouse && !insideHouse) {

        action.style.display =
            "block";

        message.textContent =
            "Старый дом. Дверь почему-то открыта.";

        return;
    }


    action.style.display =
        "none";


    if (!insideHouse) {

        message.textContent =
            "Ты один посреди пустого города...";

    }
}


/* =========================
   ДВИЖЕНИЕ
========================= */

function updateMovement() {

    if (insideHouse)
        return;

    playerX += moveX * 4;
    playerY += moveY * 4;

    /*
       Границы экрана
    */

    playerX =
        Math.max(
            20,
            Math.min(
                window.innerWidth - 20,
                playerX
            )
        );

    playerY =
        Math.max(
            110,
            Math.min(
                window.innerHeight - 90,
                playerY
            )
        );

    drawPlayer();

    checkHouse();
}


/* =========================
   ДЖОЙСТИК
========================= */

function joystickMove(x, y) {

    const rect =
        joystick.getBoundingClientRect();

    let dx =
        x -
        (rect.left + rect.width / 2);

    let dy =
        y -
        (rect.top + rect.height / 2);

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    const maxDistance = 38;

    if (distance > maxDistance) {

        dx =
            dx / distance *
            maxDistance;

        dy =
            dy / distance *
            maxDistance;
    }

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;

    moveX =
        dx / maxDistance;

    moveY =
        dy / maxDistance;
}


joystick.addEventListener(
    "touchstart",
    function(e) {

        joystickActive = true;

        joystickMove(
            e.touches[0].clientX,
            e.touches[0].clientY
        );

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    function(e) {

        if (!joystickActive)
            return;

        joystickMove(
            e.touches[0].clientX,
            e.touches[0].clientY
        );

        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    function() {

        joystickActive = false;

        moveX = 0;
        moveY = 0;

        stick.style.transform =
            "translate(0,0)";
    }
);


/* =========================
   КЛАВИАТУРА
========================= */

const keys = {};

document.addEventListener(
    "keydown",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = true;

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


function keyboardMovement() {

    if (joystickActive)
        return;

    moveX = 0;
    moveY = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    )
        moveY = -1;

    if (
        keys["s"] ||
        keys["arrowdown"]
    )
        moveY = 1;

    if (
        keys["a"] ||
        keys["arrowleft"]
    )
        moveX = -1;

    if (
        keys["d"] ||
        keys["arrowright"]
    )
        moveX = 1;
}


/* =========================
   ВХОД В ДОМ
========================= */

action.addEventListener(
    "click",
    function() {

        insideHouse = true;

        action.style.display =
            "none";

        inside.style.display =
            "block";

        message.textContent =
            "";

    }
);


/* =========================
   КЛЮЧ
========================= */

key.addEventListener(
    "click",
    function() {

        if (hasKey)
            return;

        hasKey = true;

        key.style.display =
            "none";

        inventory.innerHTML =
            "🎒 🔑 Ключ";

        document.getElementById(
            "insideText"
        ).innerHTML =
            "Ты нашёл старый ключ.<br><br>" +
            "🔑 КЛЮЧ ПОЛУЧЕН!";

    }
);


/* =========================
   ВЫХОД
========================= */

exit.addEventListener(
    "click",
    function() {

        insideHouse = false;

        inside.style.display =
            "none";

        message.textContent =
            "Ты снова на улице.";

        checkHouse();

    }
);


/* =========================
   ФОНАРИК
========================= */

flashButton.addEventListener(
    "click",
    function() {

        flashlightOn =
            !flashlightOn;

        light.style.opacity =
            flashlightOn ? "1" : "0";

        flashButton.textContent =
            flashlightOn
                ? "🔦"
                : "🌑";

    }
);


/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

function gameLoop() {

    keyboardMovement();

    updateMovement();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   СТАРТ
========================= */

drawPlayer();

gameLoop();

</script>

</body>
</html>
