<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Новый Шаг — Город</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#20252b;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#game{
    display:block;
    width:100vw;
    height:100vh;
    background:#5c8c45;
}

/* ВЕРХНЯЯ ПАНЕЛЬ */

#top{
    position:fixed;
    z-index:10;
    top:10px;
    left:10px;
    right:10px;

    display:flex;
    align-items:center;
    gap:8px;

    pointer-events:none;
}

.panel{
    background:rgba(20,25,30,.90);
    color:white;
    border:1px solid rgba(255,255,255,.18);
    border-radius:14px;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
}

#playerInfo{
    width:210px;
    padding:9px 12px;
}

#name{
    font-size:16px;
    font-weight:bold;
}

#level{
    margin-top:4px;
    font-size:12px;
    color:#ddd;
}

#xpBar{
    width:100%;
    height:7px;
    margin-top:6px;
    border-radius:10px;
    overflow:hidden;
    background:#333;
}

#xp{
    width:0%;
    height:100%;
    background:#55d66b;
}

.stat{
    min-width:82px;
    padding:12px 13px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

#quest{
    position:fixed;
    z-index:10;
    left:10px;
    top:95px;

    width:min(360px,calc(100vw - 20px));
    padding:13px 15px;

    color:white;
    background:rgba(20,25,30,.91);
    border:1px solid rgba(255,255,255,.18);
    border-radius:15px;

    box-shadow:0 5px 18px rgba(0,0,0,.35);
}

.questTitle{
    color:#ffd43b;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

#questText{
    font-size:14px;
}

/* СООБЩЕНИЕ */

#message{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:155px;
    transform:translateX(-50%);

    max-width:90%;
    padding:11px 17px;

    background:rgba(15,18,22,.94);
    color:white;
    border-radius:14px;

    text-align:center;
    font-size:14px;

    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
}

#message.show{
    opacity:1;
}

/* КНОПКА ВЗАИМОДЕЙСТВИЯ */

#action{
    position:fixed;
    z-index:15;

    right:20px;
    bottom:25px;

    width:100px;
    height:100px;

    border-radius:50%;
    border:2px solid rgba(255,255,255,.3);

    background:rgba(25,30,35,.88);
    color:white;

    font-size:14px;
    font-weight:bold;

    box-shadow:0 6px 20px rgba(0,0,0,.4);
}

#action:active{
    transform:scale(.94);
    background:#303840;
}

/* УПРАВЛЕНИЕ */

#controls{
    position:fixed;
    z-index:15;
    left:20px;
    bottom:25px;

    width:145px;
    height:145px;
}

.arrow{
    position:absolute;

    width:48px;
    height:48px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:14px;

    background:rgba(25,30,35,.88);
    color:white;

    font-size:25px;
    font-weight:bold;

    box-shadow:0 5px 15px rgba(0,0,0,.35);
}

.arrow:active{
    transform:scale(.92);
    background:#303840;
}

#up{
    left:49px;
    top:0;
}

#left{
    left:0;
    top:49px;
}

#down{
    left:49px;
    top:98px;
}

#right{
    right:0;
    top:49px;
}

/* Подсказка */

#hint{
    position:fixed;
    z-index:10;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);

    color:rgba(255,255,255,.75);
    font-size:11px;
    pointer-events:none;
}

/* МОБИЛЬНЫЕ */

@media(max-width:600px){

    #top{
        top:7px;
        left:7px;
        right:7px;
        gap:5px;
    }

    #playerInfo{
        width:145px;
        padding:7px 9px;
    }

    #name{
        font-size:13px;
    }

    #level{
        font-size:10px;
    }

    .stat{
        min-width:60px;
        padding:9px 5px;
        font-size:12px;
    }

    #quest{
        top:73px;
        left:7px;
        width:calc(100vw - 14px);
        padding:9px 12px;
    }

    #questText{
        font-size:12px;
    }

    .questTitle{
        font-size:11px;
    }

    #controls{
        left:12px;
        bottom:15px;
        transform:scale(.85);
        transform-origin:bottom left;
    }

    #action{
        right:14px;
        bottom:20px;
        width:82px;
        height:82px;
        font-size:12px;
    }

    #message{
        bottom:125px;
        font-size:12px;
    }

    #hint{
        display:none;
    }
}
</style>
</head>

<script>

/* =========================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

resize();

window.addEventListener("resize",resize);


/* =========================================================

const camera = {

};


/* =========================================================

/* =========================================================

   ========================================================= */

const WORLD_W = 2200;
const WORLD_H = 1800;


/* =========================================================

   ========================================================= */

const buildings = [

    {

    {

];


/* =========================================================

   ========================================================= */

const roads = [

    {
        x:0,

        w:2200,
        h:150
    },

    {

    },

    },

    }

];

const park = {

    w:360,

};


/* =========================================================
   ДЕРЕВЬЯ
   ========================================================= */

const trees = [];

function makeTrees(){

    trees.length = 0;

    for(let i=0;i<100;i++){

        const x = 40 + Math.random()*(WORLD_W-80);
        const y = 40 + Math.random()*(WORLD_H-80);

        let valid = true;

        for(const b of buildings){

            if(
                x > b.x-25 &&
                x < b.x+b.w+25 &&
                y > b.y-25 &&
                y < b.y+b.h+25
            ){
                valid=false;
            }
        }

        for(const r of roads){

            if(
                x > r.x-30 &&
                x < r.x+r.w+30 &&
                y > r.y-30 &&
                y < r.y+r.h+30
            ){
                valid=false;
            }
        }

        if(
            x > park.x &&
            x < park.x+park.w &&
            y > park.y &&
            y < park.y+park.h
        ){
            valid=false;
        }

        if(valid){
            trees.push({x,y,size:15+Math.random()*9});
        }
    }
}

makeTrees();

const lamps=[];

for(let x=30;x<WORLD_W;x+=90){

const cars = [

    },

];


/* =========================================================
   КВЕСТ
   ========================================================= */

let quest = 0;

const questText = document.getElementById("questText");

function updateQuest(){

    if(quest===0){

    if(quest===1){

/* =========================================================
   UI
   ========================================================= */

function updateUI(){

    document.getElementById("money").textContent =

    document.getElementById("stars").textContent =

    document.getElementById("xpText").textContent =

    document.getElementById("level").innerHTML =

/* =========================================================
   СООБЩЕНИЯ
   ========================================================= */

let messageTimer;

function showMessage(text){

    const box = document.getElementById("message");

    box.textContent = text;
    box.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer=setTimeout(()=>{

        box.classList.remove("show");

    },2500);
}


/* =========================================================
   ДВИЖЕНИЕ
   ========================================================= */

const keys = {

    up:false,
    down:false,
    left:false,
    right:false
};


function setKey(direction,value){

    keys[direction]=value;
}


window.addEventListener("keydown",e=>{

    if(
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w"
    ){
        keys.up=true;
    }

    if(
        e.key==="ArrowDown" ||
        e.key.toLowerCase()==="s"
    ){
        keys.down=true;
    }

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){
        keys.left=true;
    }

    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){
        keys.right=true;
    }

    if(e.key===" "){
        interact();
    }

});


window.addEventListener("keyup",e=>{

    if(
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w"
    ){
        keys.up=false;
    }

    if(
        e.key==="ArrowDown" ||
        e.key.toLowerCase()==="s"
    ){
        keys.down=false;
    }

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){
        keys.left=false;
    }

    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){
        keys.right=false;
    }

});


function bindButton(id,direction){

    const button=document.getElementById(id);

    button.addEventListener("pointerdown",e=>{
        e.preventDefault();
        setKey(direction,true);
    });

    button.addEventListener("pointerup",e=>{
        e.preventDefault();
        setKey(direction,false);
    });

    button.addEventListener("pointercancel",()=>{
        setKey(direction,false);
    });

    button.addEventListener("pointerleave",()=>{
        setKey(direction,false);
    });
}


bindButton("up","up");
bindButton("down","down");
bindButton("left","left");
bindButton("right","right");


/* =========================================================
   СТОЛКНОВЕНИЯ
   ========================================================= */

function circleRectCollision(cx,cy,r,rect){

    const nearestX=Math.max(
        rect.x,
        Math.min(cx,rect.x+rect.w)
    );

    const nearestY=Math.max(
        rect.y,
        Math.min(cy,rect.y+rect.h)
    );

    const dx=cx-nearestX;
    const dy=cy-nearestY;

    return dx*dx+dy*dy < r*r;
}


function canMove(x,y){

    if(
        x<20 ||
        y<20 ||
        x>WORLD_W-20 ||
        y>WORLD_H-20
    ){
        return false;
    }

    for(const b of buildings){

        if(
            circleRectCollision(
                x,
                y,
                player.radius,
                {
                    x:b.x-7,
                    y:b.y-7,
                    w:b.w+14,
                    h:b.h+14
                }
            )
        ){
            return false;
        }
    }

    return true;
}


/* =========================================================
   ОБНОВЛЕНИЕ ИГРОКА
   ========================================================= */

function movePlayer(){

    let dx=0;
    let dy=0;

    if(keys.up) dy-=1;
    if(keys.down) dy+=1;
    if(keys.left) dx-=1;
    if(keys.right) dx+=1;

    if(dx!==0 || dy!==0){

        const length=Math.sqrt(dx*dx+dy*dy);

        dx/=length;
        dy/=length;

        const speed=player.speed;

        const newX=player.x+dx*speed;
        const newY=player.y+dy*speed;

        if(canMove(newX,player.y)){
            player.x=newX;
        }

        if(canMove(player.x,newY)){
            player.y=newY;
        }
    }
}


/* =========================================================
   КАМЕРА
   ========================================================= */

function updateCamera(){

    camera.x =
        player.x -
        window.innerWidth/2;

    camera.y =
        player.y -
        window.innerHeight/2;

    camera.x=Math.max(
        0,
        Math.min(
            WORLD_W-window.innerWidth,
            camera.x
        )
    );

    camera.y=Math.max(
        0,
        Math.min(
            WORLD_H-window.innerHeight,
            camera.y
        )
    );
}


/* =========================================================
   МИР
   ========================================================= */

function drawWorld(){

    ctx.fillStyle="#65a04d";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );


    /* земля */

    ctx.fillStyle="#6da653";

    ctx.fillRect(
        0,
        0,
        WORLD_W,
        WORLD_H
    );


    /* тротуары */

    for(const r of roads){

        ctx.fillStyle="#c8c8c4";

        ctx.fillRect(
            r.x-18,
            r.y-18,
            r.w+36,
            r.h+36
        );
    }


    /* дороги */

    for(const r of roads){

        ctx.fillStyle="#363b40";

        ctx.fillRect(
            r.x,
            r.y,
            r.w,
            r.h
        );

        /* разметка */

        ctx.strokeStyle="#e9e9e5";
        ctx.lineWidth=3;
        ctx.setLineDash([30,25]);

        ctx.beginPath();

        if(r.w>r.h){

            ctx.moveTo(
                r.x,
                r.y+r.h/2
            );

            ctx.lineTo(
                r.x+r.w,
                r.y+r.h/2
            );

        }else{

            ctx.moveTo(
                r.x+r.w/2,
                r.y
            );

            ctx.lineTo(
                r.x+r.w/2,
                r.y+r.h
            );
        }

        ctx.stroke();

        ctx.setLineDash([]);
    }


    /* парк */

    ctx.fillStyle="#4d963e";

    ctx.fillRect(
        park.x,
        park.y,
        park.w,
        park.h
    );

    ctx.strokeStyle="#d9c99e";
    ctx.lineWidth=12;

    ctx.strokeRect(
        park.x+10,
        park.y+10,
        park.w-20,
        park.h-20
    );


    /* дорожки парка */

    ctx.strokeStyle="#d8c69c";
    ctx.lineWidth=15;

    ctx.beginPath();

    ctx.moveTo(
        park.x+30,
        park.y+park.h/2
    );

    ctx.lineTo(
        park.x+park.w-30,
        park.y+park.h/2
    );

    ctx.moveTo(
        park.x+park.w/2,
        park.y+30
    );

    ctx.lineTo(
        park.x+park.w/2,
        park.y+park.h-30
    );

    ctx.stroke();


    /* фонтан */

    ctx.fillStyle="#7f9da4";

    ctx.beginPath();

    ctx.arc(
        park.x+park.w/2,
        park.y+park.h/2,
        48,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#52a9d4";

    ctx.beginPath();

    ctx.arc(
        park.x+park.w/2,
        park.y+park.h/2,
        34,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* здания */

    for(const b of buildings){

        /* тень */

        ctx.fillStyle="rgba(0,0,0,.22)";

        ctx.fillRect(
            b.x+10,
            b.y+12,
            b.w,
            b.h
        );


        /* стены */

        ctx.fillStyle=b.color;

        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            b.h
        );


        /* крыша */

        ctx.fillStyle=b.roof;

        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            35
        );


        /* окна */

        ctx.fillStyle="#8bc4d9";

        const rows=4;
        const cols=Math.max(
            3,
            Math.floor(b.w/65)
        );

        for(let row=0;row<rows;row++){

            for(let col=0;col<cols;col++){

                const wx=
                    b.x+25+col*60;

                const wy=
                    b.y+55+row*43;

                if(wx<b.x+b.w-20){

                    ctx.fillRect(
                        wx,
                        wy,
                        27,
                        22
                    );
                }
            }
        }


        /* вход */

        ctx.fillStyle="#49372f";

        ctx.fillRect(
            b.x+b.w/2-17,
            b.y+b.h-55,
            34,
            55
        );
    }


    /* вывески */

    drawSign(
        805,
        165,
        250,
        45,
        "☕  КАФЕ"
    );

    drawSign(
        155,
        665,
        220,
        45,
        "✉  ПОЧТА"
    );

    drawSign(
        1425,
        665,
        300,
        45,
        "🛒  МАГАЗИН"
    );


    /* деревья */

    for(const tree of trees){

        drawTree(
            tree.x,
            tree.y,
            tree.size
        );
    }


    /* фонари */

    for(const lamp of lamps){

        drawLamp(
            lamp.x,
            lamp.y
        );
    }


    /* машины */

    for(const car of cars){

        drawCar(car);
    }


    /* посылка */

    if(packageItem.visible && !packageItem.taken){

        drawPackage(
            packageItem.x,
            packageItem.y
        );
    }


    /* Алина */

    drawAlina();


    /* игрок */

    drawPlayer();


    ctx.restore();
}


/* =========================================================
   ДЕРЕВО
   ========================================================= */

function drawTree(x,y,size){

    ctx.fillStyle="#654b35";

    ctx.fillRect(
        x-4,
        y,
        8,
        size+15
    );

    ctx.fillStyle="#2f7436";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#459044";

    ctx.beginPath();

    ctx.arc(
        x-7,
        y-7,
        size*.65,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   ФОНАРЬ
   ========================================================= */

function drawLamp(x,y){

    ctx.fillStyle="#333";

    ctx.fillRect(
        x-2,
        y-30,
        4,
        30
    );

    ctx.fillStyle="#f8df82";

    ctx.beginPath();

    ctx.arc(
        x,
        y-34,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   МАШИНА
   ========================================================= */

function drawCar(car){

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillRect(
        car.x+3,
        car.y+4,
        45,
        23
    );

    ctx.fillStyle=car.color;

    ctx.fillRect(
        car.x,
        car.y,
        45,
        23
    );

    ctx.fillStyle="#9bd0e0";

    ctx.fillRect(
        car.x+10,
        car.y+4,
        12,
        9
    );

    ctx.fillRect(
        car.x+25,
        car.y+4,
        12,
        9
    );
}


/* =========================================================
   ПОСЫЛКА
   ========================================================= */

function drawPackage(x,y){

    ctx.fillStyle="#b47a35";

    ctx.fillRect(
        x-13,
        y-13,
        26,
        26
    );

    ctx.strokeStyle="#6d431b";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(x,y-13);
    ctx.lineTo(x,y+13);

    ctx.stroke();

    ctx.fillStyle="#fff";

    ctx.font="bold 13px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        "📦",
        x,
        y+5
    );
}


/* =========================================================
   АЛИНА
   ========================================================= */

function drawAlina(){

    /* тень */

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        alina.x,
        alina.y+18,
        13,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* тело */

    ctx.fillStyle="#e86d8a";

    ctx.fillRect(
        alina.x-9,
        alina.y-2,
        18,
        22
    );


    /* голова */

    ctx.fillStyle="#f2c3a2";

    ctx.beginPath();

    ctx.arc(
        alina.x,
        alina.y-12,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* волосы */

    ctx.fillStyle="#5b3928";

    ctx.beginPath();

    ctx.arc(
        alina.x,
        alina.y-16,
        12,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* восклицание */

    ctx.fillStyle="#ffd329";

    ctx.beginPath();

    ctx.arc(
        alina.x,
        alina.y-47,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#222";

    ctx.font="bold 18px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        "!",
        alina.x,
        alina.y-41
    );


    ctx.fillStyle="#fff";

    ctx.font="bold 14px Arial";

    ctx.fillText(
        "Алина",
        alina.x,
        alina.y+43
    );
}


/* =========================================================
   ИГРОК
   ========================================================= */

function drawPlayer(){

    /* тень */

    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        player.x,
        player.y+15,
        13,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* тело */

    ctx.fillStyle="#2677d9";

    ctx.fillRect(
        player.x-9,
        player.y-2,
        18,
        23
    );


    /* голова */

    ctx.fillStyle="#f0c19e";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-14,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* волосы */

    ctx.fillStyle="#4b3429";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-18,
        12,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* указатель */

    ctx.fillStyle="#55cfff";

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y-48
    );

    ctx.lineTo(
        player.x-9,
        player.y-34
    );

    ctx.lineTo(
        player.x+9,
        player.y-34
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   ВЫВЕСКА
   ========================================================= */

function drawSign(x,y,w,h,text){

    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.fillRect(
        x+4,
        y+4,
        w,
        h
    );

    ctx.fillStyle="#934d2e";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );

    ctx.fillStyle="#fff";

    ctx.font="bold 18px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        text,
        x+w/2,
        y+29
    );
}


/* =========================================================
   МАШИНЫ
   ========================================================= */

function updateCars(){

    for(const car of cars){

        car.x +=
            car.speed *
            car.direction;

        if(car.x>WORLD_W+100){

            car.x=-100;
        }

        if(car.x<-100){

            car.x=WORLD_W+100;
        }
    }
}


/* =========================================================
   РАССТОЯНИЕ
   ========================================================= */

function distance(a,b){

    return Math.sqrt(
        Math.pow(a.x-b.x,2)+
        Math.pow(a.y-b.y,2)
    );
}


/* =========================================================
   ВЗАИМОДЕЙСТВИЕ
   ========================================================= */

function interact(){

    /* Алина */

    const dAlina=distance(
        player,
        alina
    );

    if(dAlina<80){

        if(quest===0){

            quest=1;

            packageItem.visible=true;

            updateQuest();

            showMessage(
                "Алина: Привет! Забери для меня посылку на почте."
            );

            return;
        }

        if(quest===3){

            quest=4;

            updateQuest();

            showMessage(
                "Алина: Спасибо! Теперь возвращайся ко мне."
            );

            return;
        }

        if(quest===4){

            quest=5;

            player.money+=150;
            player.xp+=100;
            player.stars+=1;

            if(player.xp>=100){

                player.xp-=100;
                player.level++;
            }

            updateQuest();
            updateUI();

            showMessage(
                "🎉 Задание выполнено! +150 💰 +100 XP"
            );

            return;
        }

        showMessage(
            "Алина: Пока нет новых заданий."
        );

        return;
    }


    /* посылка */

    const dPackage=distance(
        player,
        packageItem
    );

    if(
        quest===1 &&
        packageItem.visible &&
        !packageItem.taken &&
        dPackage<70
    ){

        packageItem.taken=true;
        packageItem.visible=false;

        quest=3;

        updateQuest();

        showMessage(
            "📦 Посылка получена! Отнеси её Алине."
        );

        return;
    }


    /* почта */

    if(
        quest===1 &&
        distance(
            player,
            {x:310,y:1000}
        )<100
    ){

        packageItem.visible=true;

        quest=2;

        updateQuest();

        showMessage(
            "📦 Посылка находится рядом с почтой."
        );

        return;
    }


    showMessage(
        "Здесь пока нечего делать."
    );
}


document.getElementById("action")
    .addEventListener("pointerdown",e=>{

        e.preventDefault();

        interact();

    });


/* =========================================================
   ИГРОВОЙ ЦИКЛ
   ========================================================= */

function gameLoop(){

    movePlayer();

    updateCars();

    updateCamera();

    drawWorld();

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   СТАРТ
   ========================================================= */

updateQuest();
updateUI();

showMessage(
    "Добро пожаловать в «Новый Шаг»! 🚶"
);

gameLoop();

</script>
