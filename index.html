<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Новый Шаг</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #7fc96b;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* Верхняя панель */

#top {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 20;

    background: rgba(20, 25, 30, 0.88);
    color: white;

    border-radius: 16px;
    padding: 12px 14px;

    box-shadow: 0 4px 15px rgba(0,0,0,.25);
}

.stats {
    display: flex;
    justify-content: space-between;
    gap: 8px;

    font-size: 14px;
    font-weight: bold;
}

#quest {
    margin-top: 8px;

    padding-top: 8px;

    border-top: 1px solid rgba(255,255,255,.2);

    font-size: 14px;
    line-height: 19px;
}

/* Сообщения */

#message {
    position: fixed;

    left: 50%;
    bottom: 150px;

    transform: translateX(-50%);

    z-index: 50;

    width: min(88%, 420px);

    padding: 13px 16px;

    border-radius: 15px;

    background: rgba(0,0,0,.9);
    color: white;

    text-align: center;

    font-size: 15px;

    display: none;
}

/* Управление */

#controls {
    position: fixed;

    left: 18px;
    bottom: 20px;

    z-index: 30;

    width: 180px;
    height: 175px;
}

.control {
    position: absolute;

    width: 54px;
    height: 54px;

    border: 0;
    border-radius: 15px;

    background: rgba(255,255,255,.94);

    font-size: 24px;

    box-shadow: 0 4px 10px rgba(0,0,0,.25);

    touch-action: none;
}

#up {
    left: 63px;
    top: 0;
}

#left {
    left: 0;
    top: 60px;
}

#down {
    left: 63px;
    top: 60px;
}

#right {
    left: 126px;
    top: 60px;
}

/* Кнопка взаимодействия */

#action {
    position: fixed;

    right: 18px;
    bottom: 45px;

    z-index: 30;

    border: 0;
    border-radius: 17px;

    padding: 15px 18px;

    background: #ffd43b;

    color: #222;

    font-weight: bold;
    font-size: 15px;

    box-shadow: 0 4px 10px rgba(0,0,0,.25);
}

/* Подсказка */

#hint {
    position: fixed;

    left: 50%;
    bottom: 10px;

    transform: translateX(-50%);

    z-index: 15;

    color: white;

    font-size: 11px;

    text-shadow: 0 1px 3px #000;

    pointer-events: none;
}

/* На маленьком экране */

@media (max-width: 420px) {

    .stats {
        font-size: 12px;
    }

    #quest {
        font-size: 13px;
    }

    #action {
        right: 12px;
        bottom: 35px;
        padding: 13px 14px;
    }

    #controls {
        left: 10px;
        bottom: 12px;
        transform: scale(.9);
        transform-origin: bottom left;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>


<div id="top">

    <div class="stats">

        <span>💰 <b id="money">500</b></span>

        <span>⭐ <b id="xp">0</b></span>

        <span>🏆 Ур. <b id="level">1</b></span>

    </div>

    <div id="quest">
        Задание: Найди Алину возле кафе.
    </div>

</div>


<div id="message"></div>


<div id="controls">

    <button class="control" id="up">⬆️</button>

    <button class="control" id="left">⬅️</button>

    <button class="control" id="down">⬇️</button>

    <button class="control" id="right">➡️</button>

</div>


<button id="action">
    💬 Взаимодействовать
</button>


<div id="hint">
    Используй стрелки для движения
</div>


<script>

/* =========================
   НАСТРОЙКА ИГРЫ
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

resize();

window.addEventListener("resize", resize);


/* =========================
   СОСТОЯНИЕ ИГРЫ
========================= */

const player = {

    x: 120,
    y: 500,

    speed: 4,

    size: 22
};


let money = 500;

let xp = 0;

let level = 1;

let quest = 0;

let hasPackage = false;


/* =========================
   УПРАВЛЕНИЕ
========================= */

const keys = {

    up: false,
    down: false,
    left: false,
    right: false
};


/* =========================
   ОБЪЕКТЫ ГОРОДА
========================= */

function getObjects() {

    return {

        shop: {
            x: 60,
            y: 120,
            w: 190,
            h: 130
        },

        cafe: {
            x: W - 250,
            y: 100,
            w: 190,
            h: 130
        },

        post: {
            x: 55,
            y: H - 270,
            w: 220,
            h: 145
        },

        park: {
            x: W / 2,
            y: H / 2 + 20,
            r: 100
        },

        alina: {
            x: W - 155,
            y: 270
        },

        package: {
            x: 160,
            y: H - 150
        }

    };
}


/* =========================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================= */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


function showMessage(text) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(function() {

            box.style.display = "none";

        }, 2600);
}


function updateUI() {

    document.getElementById("money").textContent =
        money;

    document.getElementById("xp").textContent =
        xp;

    document.getElementById("level").textContent =
        level;


    const questText =
        document.getElementById("quest");


    if (quest === 0) {

        questText.textContent =
            "Задание: Найди Алину возле кафе.";

    }

    else if (quest === 1) {

        questText.textContent =
            "Задание: Забери 📦 посылку возле почты.";

    }

    else if (quest === 2) {

        questText.textContent =
            "Задание: Отнеси 📦 посылку на почту.";

    }

    else if (quest === 3) {

        questText.textContent =
            "Задание: Вернись к Алине.";

    }

    else if (quest === 4) {

        questText.textContent =
            "🎉 Задание выполнено! Новое задание скоро появится.";

    }

}


/* =========================
   РИСОВАНИЕ ЗДАНИЯ
========================= */

function drawBuilding(
    object,
    color,
    name
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        object.x,
        object.y,
        object.w,
        object.h
    );


    /* крыша */

    ctx.fillStyle = "rgba(0,0,0,.12)";

    ctx.fillRect(
        object.x,
        object.y,
        object.w,
        15
    );


    /* окна */

    ctx.fillStyle = "#bfe8ff";

    ctx.fillRect(
        object.x + 18,
        object.y + 35,
        45,
        32
    );

    ctx.fillRect(
        object.x + object.w - 63,
        object.y + 35,
        45,
        32
    );


    /* дверь */

    ctx.fillStyle = "#654321";

    ctx.fillRect(
        object.x + object.w / 2 - 20,
        object.y + object.h - 65,
        40,
        65
    );


    /* название */

    ctx.fillStyle = "#ffffff";

    ctx.font = "bold 17px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        name,
        object.x + object.w / 2,
        object.y + object.h / 2 + 15
    );

    ctx.textAlign = "left";
}


/* =========================
   ДЕРЕВО
========================= */

function drawTree(x, y) {

    ctx.fillStyle = "#704214";

    ctx.fillRect(
        x - 5,
        y + 12,
        10,
        28
    );


    ctx.fillStyle = "#2f8f46";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        24,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================
   NPC АЛИНА
========================= */

function drawAlina(x, y) {

    /* тело */

    ctx.fillStyle = "#ec4899";

    ctx.beginPath();

    ctx.arc(
        x,
        y + 13,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* голова */

    ctx.fillStyle = "#ffd0b5";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 12,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* волосы */

    ctx.fillStyle = "#5a321f";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 17,
        15,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* имя */

    ctx.fillStyle = "#222";

    ctx.font = "bold 15px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "Алина",
        x,
        y - 38
    );

    ctx.textAlign = "left";


    /* маркер задания */

    if (
        quest === 0 ||
        quest === 3
    ) {

        ctx.fillStyle = "#ffd43b";

        ctx.beginPath();

        ctx.arc(
            x + 24,
            y - 30,
            11,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#222";

        ctx.font = "bold 14px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "!",
            x + 24,
            y - 25
        );

        ctx.textAlign = "left";
    }

}


/* =========================
   ИГРОК
========================= */

function drawPlayer() {

    /* тело */

    ctx.fillStyle = "#2563eb";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.size,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* лицо */

    ctx.fillStyle = "#ffd0b5";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y - 7,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* глаза */

    ctx.fillStyle = "#222";

    ctx.beginPath();

    ctx.arc(
        player.x - 4,
        player.y - 8,
        1.8,
        0,
        Math.PI * 2
    );

    ctx.arc(
        player.x + 4,
        player.y - 8,
        1.8,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* посылка */

    if (hasPackage) {

        ctx.font = "25px Arial";

        ctx.fillText(
            "📦",
            player.x + 20,
            player.y + 10
        );

    }

}


/* =========================
   КАРТА
========================= */

function drawMap() {

    const objects =
        getObjects();


    /* трава */

    ctx.fillStyle = "#7fc96b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* горизонтальная дорога */

    ctx.fillStyle = "#707070";

    ctx.fillRect(
        0,
        H / 2 - 45,
        W,
        90
    );


    /* вертикальная дорога */

    ctx.fillRect(
        W / 2 - 45,
        0,
        90,
        H
    );


    /* дорожная разметка */

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 4;

    ctx.setLineDash([
        22,
        18
    ]);


    ctx.beginPath();

    ctx.moveTo(
        0,
        H / 2
    );

    ctx.lineTo(
        W,
        H / 2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        W / 2,
        0
    );

    ctx.lineTo(
        W / 2,
        H
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /* магазин */

    drawBuilding(
        objects.shop,
        "#f0b35d",
        "МАГАЗИН"
    );


    /* кафе */

    drawBuilding(
        objects.cafe,
        "#d98585",
        "КАФЕ"
    );


    /* почта */

    drawBuilding(
        objects.post,
        "#70a7d8",
        "ПОЧТА"
    );


    /* парк */

    ctx.fillStyle = "#58a64c";

    ctx.beginPath();

    ctx.arc(
        objects.park.x,
        objects.park.y,
        objects.park.r,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* деревья */

    const trees = [

        [-55, -45],
        [0, -55],
        [55, -40],
        [-60, 25],
        [60, 30],
        [-10, 55],
        [35, 65]

    ];


    for (
        let i = 0;
        i < trees.length;
        i++
    ) {

        drawTree(
            objects.park.x + trees[i][0],
            objects.park.y + trees[i][1]
        );

    }


    /* посылка */

    if (
        quest === 1 &&
        !hasPackage
    ) {

        ctx.font = "34px Arial";

        ctx.fillText(
            "📦",
            objects.package.x,
            objects.package.y
        );

    }


    /* тележка */

    ctx.font = "32px Arial";

    ctx.fillText(
        "🛒",
        objects.shop.x + 85,
        objects.shop.y + 95
    );


    /* Алина */

    drawAlina(
        objects.alina.x,
        objects.alina.y
    );


    /* игрок */

    drawPlayer();

}


/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

function gameLoop() {

    drawMap();

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();


/* =========================
   ДВИЖЕНИЕ
========================= */

function movePlayer() {

    let dx = 0;
    let dy = 0;


    if (keys.up) {
        dy -= 1;
    }

    if (keys.down) {
        dy += 1;
    }

    if (keys.left) {
        dx -= 1;
    }

    if (keys.right) {
        dx += 1;
    }


    if (
        dx !== 0 ||
        dy !== 0
    ) {

        const length =
            Math.hypot(dx, dy);

        dx /= length;
        dy /= length;


        player.x +=
            dx * player.speed;

        player.y +=
            dy * player.speed;

    }


    /* границы экрана */

    player.x = Math.max(
        25,
        Math.min(
            W - 25,
            player.x
        )
    );


    player.y = Math.max(
        80,
        Math.min(
            H - 25,
            player.y
        )
    );


    requestAnimationFrame(
        movePlayer
    );

}

movePlayer();


/* =========================
   ВЗАИМОДЕЙСТВИЕ
========================= */

function interact() {

    const objects =
        getObjects();


    /* Алина */

    if (
        distance(
            player,
            objects.alina
        ) < 80
    ) {

        if (quest === 0) {

            quest = 1;

            showMessage(
                "Алина: Привет! 📦 Забери посылку возле почты."
            );

            updateUI();

            return;
        }


        if (quest === 3) {

            quest = 4;

            money += 300;

            xp += 150;


            if (xp >= 200) {

                xp -= 200;

                level++;

            }


            showMessage(
                "🎉 Отлично! Ты выполнила задание. +300 монет и +150 XP"
            );

            updateUI();

            return;
        }


        showMessage(
            "Алина: Сначала выполни текущее задание."
        );

        return;
    }


    /* Посылка */

    if (
        quest === 1 &&
        !hasPackage &&
        distance(
            player,
            objects.package
        ) < 70
    ) {

        hasPackage = true;

        quest = 2;

        showMessage(
            "📦 Посылка у тебя! Отнеси её на почту."
        );

        updateUI();

        return;
    }


    /* Почта */

    if (
        quest === 2 &&
        distance(
            player,
            {
                x:
                    objects.post.x +
                    objects.post.w / 2,

                y:
                    objects.post.y +
                    objects.post.h / 2
            }
        ) < 120
    ) {

        hasPackage = false;

        quest = 3;

        showMessage(
            "📬 Посылка доставлена! Теперь вернись к Алине."
        );

        updateUI();

        return;
    }


    /* Магазин */

    if (
        distance(
            player,
            {
                x:
                    objects.shop.x +
                    objects.shop.w / 2,

                y:
                    objects.shop.y +
                    objects.shop.h / 2
            }
        ) < 120
    ) {

        if (money >= 100) {

            money -= 100;

            showMessage(
                "🛒 Ты купила предмет за 100 монет."
            );

            updateUI();

        } else {

            showMessage(
                "💰 Недостаточно монет."
            );

        }

        return;
    }


    showMessage(
        "Подойди ближе к объекту."
    );

}


/* =========================
   КНОПКА ВЗАИМОДЕЙСТВИЯ
========================= */

document
    .getElementById("action")
    .addEventListener(
        "click",
        interact
    );


/* =========================
   КНОПКИ ДВИЖЕНИЯ
========================= */

function setupButton(
    id,
    key
) {

    const button =
        document.getElementById(id);


    function start(e) {

        e.preventDefault();

        keys[key] = true;

    }


    function stop(e) {

        e.preventDefault();

        keys[key] = false;

    }


    button.addEventListener(
        "touchstart",
        start,
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchend",
        stop,
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchcancel",
        stop,
        {
            passive: false
        }
    );


    button.addEventListener(
        "mousedown",
        start
    );


    button.addEventListener(
        "mouseup",
        stop
    );


    button.addEventListener(
        "mouseleave",
        stop
    );

}


setupButton(
    "up",
    "up"
);

setupButton(
    "down",
    "down"
);

setupButton(
    "left",
    "left"
);

setupButton(
    "right",
    "right"
);


/* =========================
   КЛАВИАТУРА
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ) {

            keys.up = true;

        }


        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ) {

            keys.down = true;

        }


        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = true;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = true;

        }


        if (
            e.key === " " ||
            e.key === "Enter"
        ) {

            interact();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ) {

            keys.up = false;

        }


        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ) {

            keys.down = false;

        }


        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = false;

        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = false;

        }

    }
);


/* =========================
   ПЕРВОНАЧАЛЬНЫЙ ЗАПУСК
========================= */

updateUI();

showMessage(
    "Добро пожаловать в «Новый Шаг»! 🌆"
);

</script>

</body>
</html>
