<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Новый Шаг</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1b2428;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
}

/* Верхняя информация */

#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.panel{
    background:rgba(15,20,23,.82);
    color:white;
    padding:9px 12px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

#name{
    font-weight:bold;
    font-size:14px;
}

#level{
    font-size:12px;
    margin-top:4px;
    opacity:.8;
}

#money{
    font-size:15px;
    font-weight:bold;
}

#stars{
    font-size:12px;
    color:#ffd76b;
    margin-top:4px;
}

/* Задание */

#quest{
    position:fixed;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 40px);
    max-width:400px;
    background:rgba(15,20,23,.84);
    color:white;
    padding:10px;
    border-radius:12px;
    text-align:center;
    z-index:10;
}

#questTitle{
    color:#a9d7bb;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:4px;
}

#questText{
    font-size:13px;
}

/* Джойстик */

#joystick{
    position:fixed;
    left:18px;
    bottom:20px;
    width:110px;
    height:110px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.22);
    z-index:20;
}

#stick{
    position:absolute;
    width:50px;
    height:50px;
    left:30px;
    top:30px;
    border-radius:50%;
    background:rgba(255,255,255,.72);
}

/* Кнопка бега */

#run{
    position:fixed;
    left:140px;
    bottom:30px;
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:rgba(15,20,23,.82);
    color:white;
    font-size:11px;
    font-weight:bold;
    z-index:20;
}

#run.active{
    background:#527d67;
}

/* Кнопка взаимодействия */

#action{
    display:none;
    position:fixed;
    right:20px;
    bottom:110px;
    width:70px;
    height:70px;
    border:0;
    border-radius:50%;
    background:rgba(15,20,23,.9);
    color:white;
    font-size:10px;
    font-weight:bold;
    z-index:20;
}

/* Миникарта */

#map{
    position:fixed;
    right:12px;
    bottom:15px;
    width:110px;
    height:80px;
    background:rgba(20,28,28,.9);
    border:2px solid rgba(255,255,255,.5);
    border-radius:10px;
    z-index:10;
}

@media(max-width:600px){

    #hud{
        top:7px;
        left:7px;
        right:7px;
    }

    .panel{
        padding:7px 9px;
    }

    #quest{
        top:64px;
        width:calc(100% - 24px);
    }

    #joystick{
        left:12px;
        bottom:12px;
        width:105px;
        height:105px;
    }

    #stick{
        left:28px;
        top:28px;
    }

    #run{
        left:125px;
        bottom:22px;
        width:54px;
        height:54px;
    }

    #map{
        right:8px;
        bottom:8px;
        width:95px;
        height:70px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="panel">
        <div id="name">НАСТЯ</div>
        <div id="level">Уровень 1</div>
    </div>

    <div class="panel">
        <div id="money">💰 100</div>
        <div id="stars">⭐ 0</div>
    </div>

</div>

<div id="quest">
    <div id="questTitle">ЗАДАНИЕ</div>
    <div id="questText">Найди Алину</div>
</div>

<canvas id="map"></canvas>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="run">БЕГ</button>

<button id="action">
    ПОГОВОРИТЬ
</button>

<script>

/* =====================================================
   НОВЫЙ ШАГ
   НОВАЯ ЛЁГКАЯ ВЕРСИЯ
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const mapCanvas = document.getElementById("map");
const mapCtx = mapCanvas.getContext("2d");

let width = 0;
let height = 0;

function resize(){

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;

    mapCanvas.width = 220;
    mapCanvas.height = 160;
}

resize();

window.addEventListener("resize", resize);


/* =====================================================
   РАЗМЕР МИРА
===================================================== */

const WORLD_WIDTH = 2400;
const WORLD_HEIGHT = 1800;


/* =====================================================
   ИГРОК
===================================================== */

const player = {

    x:1200,
    y:900,

    speed:4.5,
    runSpeed:7,

    radius:16,

    direction:"down"
};


/* =====================================================
   КАМЕРА
===================================================== */

const camera = {

    x:0,
    y:0
};


/* =====================================================
   ИГРОВЫЕ ДАННЫЕ
===================================================== */

let money = 100;
let stars = 0;
let level = 1;

let quest = 0;


/* =====================================================
   УПРАВЛЕНИЕ
===================================================== */

const keys = {};

window.addEventListener("keydown",function(event){

    keys[event.key.toLowerCase()] = true;

});

window.addEventListener("keyup",function(event){

    keys[event.key.toLowerCase()] = false;

});


/* =====================================================
   ДОРОГИ
===================================================== */

const roads = [

    {
        x:0,
        y:330,
        width:WORLD_WIDTH,
        height:150
    },

    {
        x:0,
        y:820,
        width:WORLD_WIDTH,
        height:160
    },

    {
        x:450,
        y:0,
        width:150,
        height:WORLD_HEIGHT
    },

    {
        x:1125,
        y:0,
        width:150,
        height:WORLD_HEIGHT
    },

    {
        x:1850,
        y:0,
        width:150,
        height:WORLD_HEIGHT
    }

];


/* =====================================================
   ЗДАНИЯ
===================================================== */

const buildings = [

    {x:40,y:40,w:340,h:240},
    {x:680,y:40,w:350,h:240},
    {x:1390,y:40,w:350,h:240},
    {x:2070,y:40,w:280,h:240},

    {x:40,y:540,w:350,h:230},
    {x:680,y:540,w:350,h:230},
    {x:1390,y:540,w:350,h:230},
    {x:2070,y:540,w:280,h:230},

    {x:40,y:1050,w:350,h:250},
    {x:680,y:1050,w:350,h:250},
    {x:1390,y:1050,w:350,h:250},
    {x:2070,y:1050,w:280,h:250},

    {x:40,y:1370,w:350,h:250},
    {x:680,y:1370,w:350,h:250},
    {x:1390,y:1370,w:350,h:250},
    {x:2070,y:1370,w:280,h:250}

];


/* =====================================================
   ПАРКИ
===================================================== */

const parks = [

    {
        x:680,
        y:300,
        w:350,
        h:200
    },

    {
        x:1390,
        y:300,
        w:350,
        h:200
    },

    {
        x:680,
        y:1000,
        w:350,
        h:35
    },

    {
        x:1390,
        y:1000,
        w:350,
        h:35
    }

];


/* =====================================================
   ДЕРЕВЬЯ
===================================================== */

const trees = [];

for(const park of parks){

    for(let i=0;i<18;i++){

        trees.push({

            x:park.x + 20 + Math.random()*(park.w-40),

            y:park.y + 20 + Math.random()*(Math.max(park.h-40,20)),

            size:0.7 + Math.random()*0.5

        });

    }

}


/* =====================================================
   АЛИНА
===================================================== */

const alina = {

    x:890,
    y:385,

    radius:16
};


/* =====================================================
   ПОСЫЛКА
===================================================== */

const parcel = {

    x:170,
    y:895,

    taken:false
};


/* =====================================================
   МАШИНЫ
===================================================== */

const cars = [

    {x:200,y:405,dir:1,color:"#b84d4d"},
    {x:850,y:435,dir:-1,color:"#557b9b"},
    {x:1500,y:405,dir:1,color:"#d2a44c"},
    {x:2050,y:435,dir:-1,color:"#eeeeee"},

    {x:500,y:895,dir:1,color:"#596c72"},
    {x:1300,y:925,dir:-1,color:"#8b5c70"},
    {x:1800,y:895,dir:1,color:"#d05c50"}
];


/* =====================================================
   ДЖОЙСТИК
===================================================== */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickX = 0;
let joystickY = 0;
let joystickActive = false;

function updateJoystick(clientX,clientY){

    const rect = joystick.getBoundingClientRect();

    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;

    let dx = clientX-centerX;
    let dy = clientY-centerY;

    const maxDistance = 30;

    const distance = Math.sqrt(dx*dx+dy*dy);

    if(distance > maxDistance){

        dx = dx/distance*maxDistance;
        dy = dy/distance*maxDistance;
    }

    joystickX = dx/maxDistance;
    joystickY = dy/maxDistance;

    stick.style.transform =
        "translate("+dx+"px,"+dy+"px)";
}

function stopJoystick(){

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
        "translate(0,0)";
}

joystick.addEventListener("pointerdown",function(event){

    joystickActive = true;

    joystick.setPointerCapture(event.pointerId);

    updateJoystick(
        event.clientX,
        event.clientY
    );
});

joystick.addEventListener("pointermove",function(event){

    if(!joystickActive) return;

    updateJoystick(
        event.clientX,
        event.clientY
    );
});

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);


/* =====================================================
   БЕГ
===================================================== */

const runButton = document.getElementById("run");

let running = false;

runButton.addEventListener("pointerdown",function(){

    running = true;

    runButton.classList.add("active");

});

runButton.addEventListener("pointerup",function(){

    running = false;

    runButton.classList.remove("active");

});

runButton.addEventListener("pointercancel",function(){

    running = false;

    runButton.classList.remove("active");

});


/* =====================================================
   ПРОВЕРКА СТОЛКНОВЕНИЯ
===================================================== */

function collision(x,y){

    for(const building of buildings){

        if(

            x > building.x-18 &&

            x < building.x+building.w+18 &&

            y > building.y-18 &&

            y < building.y+building.h+18

        ){

            return true;
        }

    }

    return false;
}


/* =====================================================
   ДВИЖЕНИЕ
===================================================== */

function updatePlayer(){

    let dx = 0;
    let dy = 0;

    if(keys["arrowleft"] || keys["a"]){
        dx -= 1;
    }

    if(keys["arrowright"] || keys["d"]){
        dx += 1;
    }

    if(keys["arrowup"] || keys["w"]){
        dy -= 1;
    }

    if(keys["arrowdown"] || keys["s"]){
        dy += 1;
    }

    if(Math.abs(joystickX) > 0.05){
        dx = joystickX;
    }

    if(Math.abs(joystickY) > 0.05){
        dy = joystickY;
    }

    if(dx === 0 && dy === 0){
        return;
    }

    const length = Math.sqrt(dx*dx+dy*dy);

    dx /= length;
    dy /= length;

    if(Math.abs(dx)>Math.abs(dy)){

        player.direction =
            dx>0 ? "right" : "left";

    }else{

        player.direction =
            dy>0 ? "down" : "up";
    }

    const speed =
        running
        ? player.runSpeed
        : player.speed;

    const newX =
        player.x + dx*speed;

    const newY =
        player.y + dy*speed;

    if(
        newX>20 &&
        newX<WORLD_WIDTH-20 &&
        !collision(newX,player.y)
    ){

        player.x = newX;
    }

    if(
        newY>20 &&
        newY<WORLD_HEIGHT-20 &&
        !collision(player.x,newY)
    ){

        player.y = newY;
    }
}


/* =====================================================
   МАШИНЫ
===================================================== */

function updateCars(){

    for(const car of cars){

        car.x += car.dir * 1.2;

        if(car.x > WORLD_WIDTH+50){
            car.x = -50;
        }

        if(car.x < -50){
            car.x = WORLD_WIDTH+50;
        }
    }
}


/* =====================================================
   КАМЕРА
===================================================== */

function updateCamera(){

    camera.x =
        player.x - width/2;

    camera.y =
        player.y - height/2;

    camera.x = Math.max(
        0,
        Math.min(
            WORLD_WIDTH-width,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            WORLD_HEIGHT-height,
            camera.y
        )
    );
}


/* =====================================================
   РАССТОЯНИЕ
===================================================== */

function distance(a,b){

    return Math.sqrt(
        Math.pow(a.x-b.x,2)+
        Math.pow(a.y-b.y,2)
    );
}


/* =====================================================
   КВЕСТЫ
===================================================== */

function updateQuest(){

    const action =
        document.getElementById("action");

    const text =
        document.getElementById("questText");

    const nearAlina =
        distance(player,alina)<70;

    const nearParcel =
        distance(player,parcel)<70;

    if(quest===0){

        text.textContent =
            "Найди Алину в парке";

        action.style.display =
            nearAlina ? "block":"none";

    }

    else if(quest===1){

        text.textContent =
            "Отправляйся на почту";

        action.style.display =
            nearParcel ? "block":"none";

        action.textContent =
            "ЗАБРАТЬ";

    }

    else if(quest===2){

        text.textContent =
            "Вернись к Алине";

        action.style.display =
            nearAlina ? "block":"none";

        action.textContent =
            "ПОГОВОРИТЬ";

    }

    else{

        text.textContent =
            "Задание выполнено ✨";

        action.style.display =
            "none";
    }
}


/* =====================================================
   ВЗАИМОДЕЙСТВИЕ
===================================================== */

document.getElementById("action")
.addEventListener("click",function(){

    if(quest===0){

        if(distance(player,alina)<75){

            quest = 1;
            stars += 1;
        }

    }

    else if(quest===1){

        if(distance(player,parcel)<75){

            parcel.taken = true;

            quest = 2;

            money += 50;
        }

    }

    else if(quest===2){

        if(distance(player,alina)<75){

            quest = 3;

            money += 150;
            stars += 2;
            level = 2;
        }

    }

    updateInterface();

});


/* =====================================================
   ИНТЕРФЕЙС
===================================================== */

function updateInterface(){

    document.getElementById("money").textContent =
        "💰 "+money;

    document.getElementById("stars").textContent =
        "⭐ "+stars;

    document.getElementById("level").textContent =
        "Уровень "+level;
}


/* =====================================================
   РИСОВАНИЕ НЕБА
===================================================== */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    gradient.addColorStop(
        0,
        "#506f83"
    );

    gradient.addColorStop(
        .45,
        "#8ea8a9"
    );

    gradient.addColorStop(
        1,
        "#69776f"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =====================================================
   РИСОВАНИЕ МИРА
===================================================== */

function drawWorld(){

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    /* земля */

    ctx.fillStyle = "#718174";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    /* парки */

    for(const park of parks){

        ctx.fillStyle = "#526e59";

        ctx.fillRect(
            park.x,
            park.y,
            park.w,
            park.h
        );

        ctx.fillStyle = "rgba(255,255,255,.04)";

        ctx.fillRect(
            park.x,
            park.y,
            park.w,
            5
        );
    }


    /* дороги */

    for(const road of roads){

        ctx.fillStyle = "#343b3e";

        ctx.fillRect(
            road.x,
            road.y,
            road.width,
            road.height
        );

        /* разметка */

        ctx.strokeStyle =
            "rgba(235,215,150,.6)";

        ctx.lineWidth = 3;

        ctx.setLineDash([25,25]);

        ctx.beginPath();

        if(road.width > road.height){

            const y =
                road.y+road.height/2;

            ctx.moveTo(
                road.x,
                y
            );

            ctx.lineTo(
                road.x+road.width,
                y
            );

        }else{

            const x =
                road.x+road.width/2;

            ctx.moveTo(
                x,
                road.y
            );

            ctx.lineTo(
                x,
                road.y+road.height
            );
        }

        ctx.stroke();

        ctx.setLineDash([]);
    }


    /* здания */

    for(const building of buildings){

        /* тень */

        ctx.fillStyle =
            "rgba(0,0,0,.22)";

        ctx.fillRect(
            building.x+9,
            building.y+10,
            building.w,
            building.h
        );

        /* здание */

        ctx.fillStyle =
            "#5d686d";

        ctx.fillRect(
            building.x,
            building.y,
            building.w,
            building.h
        );

        /* верх */

        ctx.fillStyle =
            "#41494d";

        ctx.fillRect(
            building.x,
            building.y,
            building.w,
            12
        );

        /* окна */

        for(
            let x=building.x+25;
            x<building.x+building.w-20;
            x+=48
        ){

            for(
                let y=building.y+32;
                y<building.y+building.h-25;
                y+=45
            ){

                ctx.fillStyle =
                    "#91b4bb";

                ctx.fillRect(
                    x,
                    y,
                    22,
                    15
                );
            }
        }

        /* дверь */

        ctx.fillStyle =
            "#252d30";

        ctx.fillRect(
            building.x+
            building.w/2-13,
            building.y+
            building.h-43,
            26,
            43
        );
    }


    /* деревья */

    for(const tree of trees){

        ctx.fillStyle =
            "rgba(0,0,0,.2)";

        ctx.beginPath();

        ctx.ellipse(
            tree.x+5,
            tree.y+13,
            16*tree.size,
            6*tree.size,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#5b4738";

        ctx.fillRect(
            tree.x-3,
            tree.y,
            6,
            18
        );


        ctx.fillStyle =
            "#34533c";

        ctx.beginPath();

        ctx.arc(
            tree.x,
            tree.y-8,
            19*tree.size,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#527653";

        ctx.beginPath();

        ctx.arc(
            tree.x-6,
            tree.y-13,
            10*tree.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* машины */

    for(const car of cars){

        drawCar(car);
    }


    /* почта */

    drawBuildingSign(
        170,
        895,
        "ПОЧТА",
        "#8b644d"
    );


    /* кафе */

    drawBuildingSign(
        820,
        550,
        "КАФЕ",
        "#80634c"
    );


    /* магазин */

    drawBuildingSign(
        2070,
        550,
        "МАГАЗИН",
        "#4d6b72"
    );


    /* посылка */

    if(!parcel.taken){

        ctx.fillStyle =
            "#c58a48";

        ctx.fillRect(
            parcel.x-14,
            parcel.y-11,
            28,
            22
        );

        ctx.strokeStyle =
            "#704b2c";

        ctx.strokeRect(
            parcel.x-14,
            parcel.y-11,
            28,
            22
        );

        ctx.fillStyle =
            "#e1b778";

        ctx.fillRect(
            parcel.x-2,
            parcel.y-11,
            4,
            22
        );
    }


    /* Алина */

    drawCharacter(
        alina.x,
        alina.y,
        "#d58f99",
        "А"
    );


    /* игрок */

    drawCharacter(
        player.x,
        player.y,
        "#7198bd",
        "Я"
    );


    ctx.restore();
}


/* =====================================================
   МАШИНА
===================================================== */

function drawCar(car){

    ctx.save();

    ctx.translate(
        car.x,
        car.y
    );

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.fillRect(
        -25,
        -8,
        50,
        18
    );

    ctx.fillStyle =
        car.color;

    ctx.fillRect(
        -24,
        -10,
        48,
        20
    );

    ctx.fillStyle =
        "#9bb8bd";

    ctx.fillRect(
        -9,
        -7,
        18,
        14
    );

    ctx.fillStyle =
        "#202528";

    ctx.fillRect(
        -18,
        -13,
        9,
        4
    );

    ctx.fillRect(
        9,
        -13,
        9,
        4
    );

    ctx.restore();
}


/* =====================================================
   ТАБЛИЧКА
===================================================== */

function drawBuildingSign(x,y,text,color){

    ctx.fillStyle =
        "rgba(0,0,0,.2)";

    ctx.fillRect(
        x+6,
        y+7,
        120,
        50
    );

    ctx.fillStyle = color;

    ctx.fillRect(
        x,
        y,
        120,
        50
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        text,
        x+60,
        y+31
    );
}


/* =====================================================
   ПЕРСОНАЖ
===================================================== */

function drawCharacter(x,y,color,letter){

    /* тень */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+22,
        18,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* тело */

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        x,
        y+7,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* голова */

    ctx.fillStyle =
        "#e1ae94";

    ctx.beginPath();

    ctx.arc(
        x,
        y-11,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* волосы */

    ctx.fillStyle =
        "#3a2d29";

    ctx.beginPath();

    ctx.arc(
        x,
        y-15,
        11,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* буква */

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 9px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        letter,
        x,
        y+10
    );
}


/* =====================================================
   МИНИКАРТА
===================================================== */

function drawMiniMap(){

    const sx =
        mapCanvas.width/WORLD_WIDTH;

    const sy =
        mapCanvas.height/WORLD_HEIGHT;


    mapCtx.fillStyle =
        "#657468";

    mapCtx.fillRect(
        0,
        0,
        mapCanvas.width,
        mapCanvas.height
    );


    /* дороги */

    for(const road of roads){

        mapCtx.fillStyle =
            "#363d3f";

        mapCtx.fillRect(
            road.x*sx,
            road.y*sy,
            road.width*sx,
            road.height*sy
        );
    }


    /* Алина */

    mapCtx.fillStyle =
        "#ef9fa7";

    mapCtx.beginPath();

    mapCtx.arc(
        alina.x*sx,
        alina.y*sy,
        4,
        0,
        Math.PI*2
    );

    mapCtx.fill();


    /* игрок */

    mapCtx.fillStyle =
        "#ffffff";

    mapCtx.beginPath();

    mapCtx.arc(
        player.x*sx,
        player.y*sy,
        4,
        0,
        Math.PI*2
    );

    mapCtx.fill();
}


/* =====================================================
   ЛЁГКИЙ КИНОЭФФЕКТ
===================================================== */

function drawCinema(){

    /* затемнение сверху */

    const top =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height*.25
        );

    top.addColorStop(
        0,
        "rgba(15,25,32,.22)"
    );

    top.addColorStop(
        1,
        "rgba(15,25,32,0)"
    );

    ctx.fillStyle = top;

    ctx.fillRect(
        0,
        0,
        width,
        height*.25
    );


    /* лёгкое затемнение снизу */

    const bottom =
        ctx.createLinearGradient(
            0,
            height*.7,
            0,
            height
        );

    bottom.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    bottom.addColorStop(
        1,
        "rgba(0,0,0,.18)"
    );

    ctx.fillStyle = bottom;

    ctx.fillRect(
        0,
        height*.7,
        width,
        height*.3
    );
}


/* =====================================================
   ГЛАВНЫЙ ЦИКЛ
===================================================== */

function gameLoop(){

    updatePlayer();

    updateCars();

    updateCamera();

    updateQuest();

    drawBackground();

    drawWorld();

    drawCinema();

    drawMiniMap();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   ЗАПУСК
===================================================== */

updateInterface();

gameLoop();

</script>
