<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Новый Шаг — City 2.9D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20292a;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%}
.bar{position:fixed;left:0;width:100%;height:4.5vh;background:#070808;z-index:50}
#top{top:0}#bot{bottom:0}
#hud{position:fixed;top:calc(4.5vh + 8px);left:9px;right:9px;display:flex;justify-content:space-between;z-index:60;pointer-events:none}
.card{padding:8px 11px;color:#fff;background:rgba(15,20,21,.78);border:1px solid #ffffff22;border-radius:14px;backdrop-filter:blur(8px);box-shadow:0 5px 20px #0005}
#name{font-size:14px;font-weight:bold}#lvl{font-size:11px;opacity:.75;margin-top:3px}
#xp{width:125px;height:5px;background:#ffffff22;border-radius:5px;margin-top:6px;overflow:hidden}
#xpFill{height:100%;width:0;background:#a9d8b8}
#money{font-weight:bold;font-size:14px}#stars{font-size:12px;color:#ffd45e;margin-top:4px}
#quest{position:fixed;z-index:60;top:calc(4.5vh + 68px);left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));padding:9px 12px;text-align:center;color:#fff;background:#101617cc;border:1px solid #ffffff22;border-radius:14px;backdrop-filter:blur(8px)}
#qt{font-size:9px;letter-spacing:2px;color:#a8d9b9;margin-bottom:4px}#q{font-size:12px}
#map{position:fixed;right:9px;bottom:calc(4.5vh + 8px);width:108px;height:80px;z-index:60;border:2px solid #fff8;border-radius:10px;background:#425744}
#joy{position:fixed;left:12px;bottom:calc(4.5vh + 12px);width:108px;height:108px;border-radius:50%;z-index:70;background:#ffffff12;border:2px solid #ffffff2c}
#stick{position:absolute;width:50px;height:50px;left:27px;top:27px;border-radius:50%;background:#ffffffbd;box-shadow:0 5px 15px #0005}
#run,#act{position:fixed;z-index:70;border:0;color:white;font-weight:bold;border-radius:50%;background:#111b1ddd;border:1px solid #ffffff30}
#run{left:130px;bottom:calc(4.5vh + 20px);width:57px;height:57px;font-size:10px}
#run.on{background:#557d66}
#act{right:17px;bottom:calc(4.5vh + 98px);width:68px;height:68px;font-size:9px;display:none}
#toast{position:fixed;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);background:#080c0dcc;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none}
@media(max-width:600px){
#hud{top:calc(4.5vh + 5px);left:6px;right:6px}.card{padding:7px 9px}
#name{font-size:12px}#quest{top:calc(4.5vh + 61px)}#q{font-size:11px}
#joy{left:9px;bottom:calc(4.5vh + 8px);width:103px;height:103px}
#stick{left:25px;top:25px}#run{left:119px;bottom:calc(4.5vh + 16px);width:53px;height:53px}
#map{right:7px;bottom:calc(4.5vh + 7px);width:94px;height:69px}
#act{right:8px;bottom:calc(4.5vh + 87px);width:63px;height:63px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="top" class="bar"></div><div id="bot" class="bar"></div>

<div id="hud">
 <div class="card">
  <div id="name">НАСТЯ</div>
  <div id="lvl">Уровень 1</div>
  <div id="xp"><div id="xpFill"></div></div>
 </div>
 <div class="card" style="text-align:right">
  <div id="money">💰 100</div>
  <div id="stars">⭐ 0</div>
 </div>
</div>

<div id="quest">
 <div id="qt">ЗАДАНИЕ</div>
 <div id="q">Найди Алину в парке</div>
</div>

<canvas id="map"></canvas>

<div id="joy"><div id="stick"></div></div>
<button id="run">БЕГ</button>
<button id="act">ДЕЙСТВИЕ</button>
<div id="toast"></div>

<script>
/* ==========================================================
   НОВЫЙ ШАГ — 2.9D CITY
========================================================== */

const C=document.getElementById("game"),X=C.getContext("2d");
const M=document.getElementById("map"),MX=M.getContext("2d");
let W=innerWidth,H=innerHeight;

function resize(){
 W=innerWidth;H=innerHeight;C.width=W;C.height=H;M.width=220;M.height=165;
}
resize();addEventListener("resize",resize);

/* ---------- МИР ---------- */

const WW=4200,WH=3000;

const P={
 x:2040,y:1470,r:15,
 speed:4.0,run:6.2,walk:0,dir:"down"
};

const cam={x:0,y:0};

let money=100,xp=0,level=1,stars=0,mission=0;

/* ---------- ДОРОГИ ---------- */

const roads=[
 {x:0,y:380,w:4200,h:150},
 {x:0,y:930,w:4200,h:160},
 {x:0,y:1500,w:4200,h:170},
 {x:0,y:2110,w:4200,h:160},
 {x:0,y:2670,w:4200,h:160},
 {x:470,y:0,w:150,h:3000},
 {x:1260,y:0,w:160,h:3000},
 {x:2070,y:0,w:165,h:3000},
 {x:2900,y:0,w:160,h:3000},
 {x:3650,y:0,w:150,h:3000}
];

const river={x:3840,y:0,w:360,h:3000};

const bridges=[
 {x:3750,y:420,w:450,h:72},
 {x:3750,y:970,w:450,h:72},
 {x:3750,y:1540,w:450,h:72},
 {x:3750,y:2150,w:450,h:72},
 {x:3750,y:2705,w:450,h:72}
];

/* ---------- ЗДАНИЯ ---------- */

const buildings=[];

function B(x,y,w,h,type="house"){
 buildings.push({x,y,w,h,type,t:Math.random()});
}

[
[35,50,350,260,"house"],[670,50,260,260,"house"],
[960,50,230,260,"shop"],[1500,50,330,260,"office"],
[2320,50,430,260,"office"],[3050,50,350,260,"house"],

[35,570,350,270,"house"],[670,570,260,270,"cafe"],
[960,570,230,270,"house"],[1500,570,330,270,"office"],
[2320,570,430,270,"office"],[3050,570,350,270,"shop"],

[35,1140,350,280,"house"],[670,1140,260,280,"shop"],
[960,1140,230,280,"police"],[1500,1140,330,280,"hospital"],
[2320,1140,430,280,"office"],[3050,1140,350,280,"shop"],

[35,1710,350,310,"house"],[670,1710,260,310,"house"],
[960,1710,230,310,"cafe"],[1500,1710,330,310,"office"],
[2320,1710,430,310,"house"],[3050,1710,350,310,"shop"],

[35,2280,350,310,"house"],[670,2280,260,310,"house"],
[960,2280,230,310,"shop"],[1500,2280,330,310,"office"],
[2320,2280,430,310,"house"],[3050,2280,350,310,"garage"]
].forEach(a=>B(...a));

function blocked(x,y){
 for(const b of buildings)
  if(x>b.x-15&&x<b.x+b.w+15&&y>b.y-15&&y<b.y+b.h+15)return true;
 return false;
}

/* ---------- ПАРКИ ---------- */

const parks=[
 {x:650,y:300,w:520,h:70},
 {x:1450,y:300,w:520,h:70},
 {x:650,y:1090,w:520,h:45},
 {x:1450,y:1090,w:520,h:45},
 {x:1450,y:2030,w:520,h:55},
 {x:650,y:2590,w:520,h:55}
];

/* ---------- ДЕРЕВЬЯ ---------- */

const trees=[];

for(const p of parks){
 for(let i=0;i<28;i++){
  trees.push({
   x:p.x+15+Math.random()*(p.w-30),
   y:p.y+8+Math.random()*(Math.max(25,p.h-16)),
   s:.65+Math.random()*.55
  });
 }
}

for(let i=0;i<180;i++){
 let x=80+Math.random()*3600,y=80+Math.random()*2800;
 if(!blocked(x,y)&&x<3800)trees.push({x,y,s:.55+Math.random()*.5});
}

/* ---------- NPC ---------- */

const colors=[
 ["#e3ae8d","#3c2b26","#718fa7","#414956"],
 ["#d49c7c","#292521","#b87568","#4b4b57"],
 ["#edbb9b","#50352c","#719d79","#3c464a"],
 ["#d9a17e","#332926","#9b8264","#455463"],
 ["#e2ad8e","#49312b","#9673a2","#414753"]
];

const names=["Маша","Илья","Катя","Лёша","Дима","Соня","Макс","Оля","Артём","Ника","Миша","Лера","Егор","Вика","Рома","Полина","Кирилл","Аня","Саша","Даня"];

function person(x,y,c,name){
 return {
  x,y,homeX:x,homeY:y,
  skin:c[0],hair:c[1],shirt:c[2],pants:c[3],
  name,dx:Math.random()-.5,dy:Math.random()-.5,
  speed:.25+Math.random()*.35,timer:Math.random()*100,
  walk:Math.random()*10
 };
}

const ALINA=person(850,330,colors[1],"Алина");
const NPC=[];

for(let i=0;i<38;i++){
 let x=100+Math.random()*3500,y=100+Math.random()*2750;
 if(blocked(x,y)||x>3780){i--;continue}
 NPC.push(person(x,y,colors[i%colors.length],names[i%names.length]));
}

/* ---------- МАШИНЫ ---------- */

const cars=[];
const carColors=["#b74444","#496e91","#c69c40","#dededb","#4c5c62","#765b7d","#a9704e","#333b42"];

const ry=[455,1005,1580,2190,2750];

for(let i=0;i<34;i++){
 cars.push({
  x:Math.random()*3750,
  y:ry[i%ry.length]+(i%2?-30:30),
  dir:i%2?1:-1,
  speed:.7+Math.random()*1.1,
  color:carColors[i%carColors.length],
  type:i%6===0?"sport":i%5===0?"suv":"sedan"
 });
}

/* ---------- МЕСТА ---------- */

const places=[
 {x:100,y:1160,w:220,h:100,n:"ПОЧТА"},
 {x:990,y:1160,w:170,h:100,n:"ПОЛИЦИЯ"},
 {x:1540,y:1160,w:250,h:100,n:"БОЛЬНИЦА"},
 {x:700,y:585,w:200,h:100,n:"КАФЕ"},
 {x:3100,y:1160,w:230,h:100,n:"МАГАЗИН"},
 {x:3100,y:1740,w:230,h:100,n:"ГАРАЖ"}
];

/* ---------- УПРАВЛЕНИЕ ---------- */

const keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let jx=0,jy=0,jOn=false;

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

function joystickMove(x,y){
 const r=joy.getBoundingClientRect();
 let dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);
 const max=31,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 jx=dx/max;jy=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}

function joystickStop(){
 jx=0;jy=0;jOn=false;
 stick.style.transform="translate(0,0)";
}

joy.onpointerdown=e=>{
 jOn=true;joy.setPointerCapture(e.pointerId);joystickMove(e.clientX,e.clientY)
};
joy.onpointermove=e=>{if(jOn)joystickMove(e.clientX,e.clientY)};
joy.onpointerup=joystickStop;
joy.onpointercancel=joystickStop;

let running=false;
const run=document.getElementById("run");

run.onpointerdown=()=>{running=true;run.classList.add("on")};
run.onpointerup=()=>{running=false;run.classList.remove("on")};
run.onpointercancel=()=>{running=false;run.classList.remove("on")};

/* ---------- ДВИЖЕНИЕ ---------- */

function updatePlayer(){
 let dx=0,dy=0;

 if(keys.w||keys.arrowup)dy--;
 if(keys.s||keys.arrowdown)dy++;
 if(keys.a||keys.arrowleft)dx--;
 if(keys.d||keys.arrowright)dx++;

 if(Math.abs(jx)>.05)dx=jx;
 if(Math.abs(jy)>.05)dy=jy;

 if(!dx&&!dy)return;

 let d=Math.hypot(dx,dy);
 dx/=d;dy/=d;

 if(Math.abs(dx)>Math.abs(dy))P.dir=dx>0?"right":"left";
 else P.dir=dy>0?"down":"up";

 let sp=running?P.run:P.speed;
 let nx=P.x+dx*sp,ny=P.y+dy*sp;

 if(nx>20&&nx<WW-20&&!blocked(nx,P.y))P.x=nx;
 if(ny>20&&ny<WH-20&&!blocked(P.x,ny))P.y=ny;

 P.walk+=.24;
}

/* ---------- NPC ---------- */

function updateNPC(n){
 n.timer--;
 if(n.timer<=0){
  n.timer=70+Math.random()*180;
  let a=Math.random()*Math.PI*2;
  n.dx=Math.cos(a);n.dy=Math.sin(a);
 }

 let nx=n.x+n.dx*n.speed,ny=n.y+n.dy*n.speed;

 if(nx>40&&nx<WW-40&&!blocked(nx,n.y))n.x=nx;else n.dx*=-1;
 if(ny>40&&ny<WH-40&&!blocked(n.x,ny))n.y=ny;else n.dy*=-1;

 n.walk+=.08;
}

function updateAllNPC(){
 updateNPC(ALINA);
 NPC.forEach(updateNPC);
}

/* ---------- МАШИНЫ ---------- */

function updateCars(){
 for(const c of cars){
  c.x+=c.speed*c.dir;
  if(c.x>WW+80)c.x=-80;
  if(c.x<-80)c.x=WW+80;
 }
}

/* ---------- КАМЕРА ---------- */

function updateCamera(){
 cam.x+=(P.x-W/2-cam.x)*.10;
 cam.y+=(P.y-H/2-cam.y)*.10;

 cam.x=Math.max(0,Math.min(WW-W,cam.x));
 cam.y=Math.max(0,Math.min(WH-H,cam.y));
}

/* ==========================================================
   РИСОВКА 2.9D
========================================================== */

function sky(){
 let g=X.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#53758a");
 g.addColorStop(.48,"#9bb2ac");
 g.addColorStop(1,"#738077");
 X.fillStyle=g;X.fillRect(0,0,W,H);
}

function ground(){
 X.fillStyle="#748578";
 X.fillRect(0,0,WW,WH);

 X.fillStyle="#4c899c";
 X.fillRect(river.x,0,river.w,WH);

 X.strokeStyle="#ffffff18";
 X.lineWidth=2;

 for(let y=0;y<WH;y+=55){
  X.beginPath();
  X.moveTo(river.x+15,y);
  X.lineTo(river.x+river.w-15,y+8);
  X.stroke();
 }
}

function road(){
 for(const r of roads){
  X.fillStyle="#353d40";
  X.fillRect(r.x,r.y,r.w,r.h);

  X.fillStyle="#293033";
  if(r.w>r.h){
   X.fillRect(r.x,r.y,r.w,7);
   X.fillRect(r.x,r.y+r.h-7,r.w,7);
  }else{
   X.fillRect(r.x,r.y,7,r.h);
   X.fillRect(r.x+r.w-7,r.y,7,r.h);
  }

  X.strokeStyle="#d9c98599";
  X.lineWidth=3;
  X.setLineDash([30,26]);
  X.beginPath();

  if(r.w>r.h){
   X.moveTo(r.x,r.y+r.h/2);
   X.lineTo(r.x+r.w,r.y+r.h/2);
  }else{
   X.moveTo(r.x+r.w/2,r.y);
   X.lineTo(r.x+r.w/2,r.y+r.h);
  }

  X.stroke();
  X.setLineDash([]);
 }
}

function park(){
 for(const p of parks){
  X.fillStyle="#52755b";
  X.fillRect(p.x,p.y,p.w,p.h);

  X.fillStyle="#ffffff10";
  for(let i=0;i<4;i++)
   X.fillRect(p.x,p.y+i*17,p.w,2);
 }
}

function buildings(){
 for(const b of buildings){

  /* длинная 3D-тень */
  X.fillStyle="#00000035";
  X.beginPath();
  X.moveTo(b.x+12,b.y+14);
  X.lineTo(b.x+b.w+18,b.y+14);
  X.lineTo(b.x+b.w+18,b.y+b.h+18);
  X.lineTo(b.x+12,b.y+b.h+18);
  X.fill();

  const cols=["#657278","#746b67","#63756c","#777078"];
  X.fillStyle=cols[Math.floor(b.t*4)];
  X.fillRect(b.x,b.y,b.w,b.h);

  /* верхняя плоскость */
  X.fillStyle="#3f474a";
  X.fillRect(b.x,b.y,b.w,14);

  /* вертикальные панели */
  X.strokeStyle="#ffffff0c";
  X.lineWidth=2;

  for(let xx=b.x+55;xx<b.x+b.w;xx+=55){
   X.beginPath();
   X.moveTo(xx,b.y);
   X.lineTo(xx,b.y+b.h);
   X.stroke();
  }

  /* окна */
  for(let xx=b.x+18;xx<b.x+b.w-25;xx+=46){
   for(let yy=b.y+28;yy<b.y+b.h-35;yy+=48){

    X.fillStyle=((xx+yy)%92<46)?"#89aeb7":"#678c96";
    X.fillRect(xx,yy,25,18);

    X.fillStyle="#ffe7a51c";
    X.fillRect(xx+2,yy+2,21,14);
   }
  }

  /* дверь */
  X.fillStyle="#263033";
  X.fillRect(b.x+b.w/2-15,b.y+b.h-53,30,53);

  /* маркировка */
  if(b.type==="police"||b.type==="hospital"||b.type==="cafe"||b.type==="shop"||b.type==="garage"){
   X.fillStyle="#ffffffdd";
   X.font="bold 11px Arial";
   X.textAlign="center";
   let txt=b.type==="police"?"ПОЛИЦИЯ":
          b.type==="hospital"?"БОЛЬНИЦА":
          b.type==="cafe"?"КАФЕ":
          b.type==="shop"?"МАГАЗИН":
          "GARAGE";
   X.fillText(txt,b.x+b.w/2,b.y+28);
  }
 }
}

function treesDraw(){
 for(const t of trees){

  X.fillStyle="#00000025";
  X.beginPath();
  X.ellipse(t.x+6,t.y+19,19*t.s,7*t.s,0,0,Math.PI*2);
  X.fill();

  X.fillStyle="#624936";
  X.fillRect(t.x-3*t.s,t.y-2,6*t.s,24*t.s);

  X.fillStyle="#36573d";
  X.beginPath();
  X.arc(t.x,t.y-10*t.s,23*t.s,0,Math.PI*2);
  X.fill();

  X.fillStyle="#5d7e5b";
  X.beginPath();
  X.arc(t.x-8*t.s,t.y-17*t.s,12*t.s,0,Math.PI*2);
  X.fill();

  X.fillStyle="#78956d";
  X.beginPath();
  X.arc(t.x+8*t.s,t.y-7*t.s,9*t.s,0,Math.PI*2);
  X.fill();
 }
}

function car(c){

 X.save();
 X.translate(c.x,c.y);

 if(c.dir<0)X.scale(-1,1);

 let w=c.type==="sport"?60:c.type==="suv"?64:57;
 let h=c.type==="suv"?25:22;

 /* тень */
 X.fillStyle="#00000042";
 X.beginPath();
 X.ellipse(2,9,w*.55,8,0,0,Math.PI*2);
 X.fill();

 /* кузов */
 X.fillStyle=c.color;
 X.beginPath();
 X.roundRect(-w/2,-h/2,w,h,6);
 X.fill();

 /* капот */
 X.fillStyle="#ffffff10";
 X.fillRect(-w/2,-h/2+3,w*.25,h-6);

 /* крыша */
 X.fillStyle=c.color;
 X.beginPath();
 X.moveTo(-w*.25,-h/2);
 X.lineTo(-w*.08,-h*.82);
 X.lineTo(w*.20,-h*.82);
 X.lineTo(w*.34,-h/2);
 X.closePath();
 X.fill();

 /* стекла */
 X.fillStyle="#7899a5";
 X.beginPath();
 X.moveTo(-w*.18,-h*.43);
 X.lineTo(-w*.05,-h*.72);
 X.lineTo(w*.08,-h*.72);
 X.lineTo(w*.21,-h*.43);
 X.closePath();
 X.fill();

 /* блики */
 X.fillStyle="#ffffff35";
 X.fillRect(-w*.10,-h*.69,w*.13,3);

 /* колёса */
 X.fillStyle="#171b1d";
 X.fillRect(-w*.34,-h*.67,12,6);
 X.fillRect(w*.18,-h*.67,12,6);
 X.fillRect(-w*.34,h*.48,12,6);
 X.fillRect(w*.18,h*.48,12,6);

 /* фары */
 X.fillStyle="#fff4bc";
 X.fillRect(w/2-5,-h*.34,5,6);

 X.fillStyle="#d94d4d";
 X.fillRect(-w/2,-h*.34,5,6);

 X.restore();
}

function personDraw(n,player=false){

 let bob=Math.sin(n.walk)*2;
 let x=n.x,y=n.y+bob;

 /* тень */
 X.fillStyle="#00000035";
 X.beginPath();
 X.ellipse(x,y+24,18,7,0,0,Math.PI*2);
 X.fill();

 /* ноги */
 X.fillStyle=n.pants;
 X.fillRect(x-8,y+6,7,20);
 X.fillRect(x+1,y+6,7,20);

 /* обувь */
 X.fillStyle="#202426";
 X.fillRect(x-10,y+23,9,5);
 X.fillRect(x+2,y+23,9,5);

 /* тело */
 X.fillStyle=n.shirt;
 X.beginPath();
 X.roundRect(x-12,y-8,24,22,7);
 X.fill();

 /* руки */
 X.fillStyle=n.skin;
 X.fillRect(x-16,y-5,6,17);
 X.fillRect(x+10,y-5,6,17);

 /* голова */
 X.fillStyle=n.skin;
 X.beginPath();
 X.arc(x,y-18,13,0,Math.PI*2);
 X.fill();

 /* волосы */
 X.fillStyle=n.hair;
 X.beginPath();
 X.arc(x,y-23,13,Math.PI,Math.PI*2);
 X.fill();
 X.fillRect(x-13,y-24,26,7);

 /* лицо */
 X.fillStyle="#332923";
 X.fillRect(x-6,y-18,2,2);
 X.fillRect(x+4,y-18,2,2);

 /* маркер главного NPC */
 if(n===ALINA){
  X.fillStyle="#9fe0ba";
  X.beginPath();
  X.moveTo(x,y-53);
  X.lineTo(x-7,y-43);
  X.lineTo(x+7,y-43);
  X.closePath();
  X.fill();

  X.fillStyle="#fff";
  X.font="bold 10px Arial";
  X.textAlign="center";
  X.fillText("АЛИНА",x,y-58);
 }

 /* имя ближайшего NPC */
 if(!player && distance(P,n)<120){
  X.fillStyle="#ffffffdd";
  X.font="9px Arial";
  X.textAlign="center";
  X.fillText(n.name,x,y-40);
 }
}

function drawPlayer(){
 personDraw({
  x:P.x,y:P.y,
  skin:"#e2ae8c",
  hair:"#3b2925",
  shirt:"#c96f7c",
  pants:"#424b5b",
  walk:P.walk
 },true);

 /* стрелка */
 X.fillStyle="#ffffffaa";
 X.beginPath();
 X.arc(P.x,P.y-43,3,0,Math.PI*2);
 X.fill();
}

/* ---------- СОРТИРОВКА ПО ГЛУБИНЕ ---------- */

function world(){

 sky();

 X.save();
 X.translate(-cam.x,-cam.y);

 ground();
 road();
 park();

 /* дальние объекты */
 buildings();

 places.forEach(p=>{
  X.fillStyle="#ffffff12";
  X.fillRect(p.x,p.y,p.w,p.h);
 });

 treesDraw();

 cars.forEach(car);

 const actors=[...NPC,ALINA,{x:P.x,y:P.y,player:true}];
 actors.sort((a,b)=>a.y-b.y);

 for(const a=>{
  if(a.player)drawPlayer();
  else personDraw(a);
 }

 X.restore();
}

/* ---------- МИНИ-КАРТА ---------- */

function minimap(){

 MX.clearRect(0,0,M.width,M.height);

 MX.fillStyle="#526b58";
 MX.fillRect(0,0,M.width,M.height);

 MX.fillStyle="#3f7d91";
 MX.fillRect(
  river.x/WW*M.width,
  0,
  river.w/WW*M.width,
  M.height
 );

 MX.fillStyle="#353b3d";

 for(const r of roads){
  MX.fillRect(
   r.x/WW*M.width,
   r.y/WH*M.height,
   r.w/WW*M.width,
   r.h/WH*M.height
  );
 }

 MX.fillStyle="#77706b";

 for(const b of buildings){
  MX.fillRect(
   b.x/WW*M.width,
   b.y/WH*M.height,
   b.w/WW*M.width,
   b.h/WH*M.height
  );
 }

 MX.fillStyle="#ffffff";

 MX.beginPath();
 MX.arc(
  P.x/WW*M.width,
  P.y/WH*M.height,
  4,0,Math.PI*2
 );
 MX.fill();

 MX.fillStyle="#9fe0ba";

 MX.beginPath();
 MX.arc(
  ALINA.x/WW*M.width,
  ALINA.y/WH*M.height,
  3,0,Math.PI*2
 );
 MX.fill();
}

/* ---------- МИССИИ ---------- */

const missions=[
 "Найди Алину в парке",
 "Встреться с Алиной в кафе",
 "Купи кофе",
 "Забери посылку на почте",
 "Отнеси посылку Алине",
 "Зайди в магазин",
 "Поговори с полицейским",
 "Посети больницу",
 "Найди гараж",
 "Вернись в центр города",
 "Все задания выполнены ✨"
];

const targets=[
 ALINA,
 {x:800,y:630},
 {x:800,y:630},
 {x:210,y:1190},
 ALINA,
 {x:3170,y:1190},
 {x:1070,y:1190},
 {x:1660,y:1190},
 {x:3170,y:1780},
 {x:2040,y:1470}
];

function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function missionUpdate(){

 const t=targets[mission];
 const button=document.getElementById("act");

 if(!t){
  button.style.display="none";
  return;
 }

 button.style.display=dist(P,t)<100?"block":"none";

 const texts=[
  "ПОГОВОРИТЬ",
  "ВСТРЕТИТЬСЯ",
  "КУПИТЬ",
  "ЗАБРАТЬ",
  "ОТДАТЬ",
  "ВОЙТИ",
  "ПОГОВОРИТЬ",
  "ПОСЕТИТЬ",
  "ГАРАЖ",
  "ЗАВЕРШИТЬ"
 ];

 button.textContent=texts[mission]||"ДЕЙСТВИЕ";
}

document.getElementById("act").onclick=()=>{

 const t=targets[mission];

 if(!t||dist(P,t)>105)return;

 const rewards=[
  [25,1],[30,1],[35,1],[55,1],[65,1],
  [45,1],[70,2],[60,1],[100,2],[150,3]
 ];

 const r=rewards[mission]||[20,1];

 money+=r[0];
 stars+=r[1];
 xp+=25;

 if(xp>=100){
  xp-=100;
  level++;
 }

 mission++;

 document.getElementById("q").textContent=missions[mission];

 document.getElementById("money").textContent="💰 "+money;
 document.getElementById("stars").textContent="⭐ "+stars;
 document.getElementById("lvl").textContent="Уровень "+level;
 document.getElementById("xpFill").style.width=xp+"%";

 showToast("Задание выполнено  +$"+r[0]);
};

function showToast(text){
 const t=document.getElementById("toast");
 t.textContent=text;
 t.style.opacity=1;
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.opacity=0,1700);
}

/* ---------- ИГРОВОЙ ЦИКЛ ---------- */

function update(){
 updatePlayer();
 updateAllNPC();
 updateCars();
 updateCamera();
 missionUpdate();
}

function render(){
 X.clearRect(0,0,W,H);
 world();
 minimap();
}

function loop(){
 update();
 render();
 requestAnimationFrame(loop);
}

document.getElementById("q").textContent=missions[0];
loop();

</script>
</body>
</html>
